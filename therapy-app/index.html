    const eb=document.createElement('button'); eb.textContent=L('editGoal'); eb.style.cssText=`background:none;border:1px solid ${T.border};border-radius:8px;padding:4px 10px;font-size:11px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;`; eb.onclick=()=>{S.editIdx=i;S.step=3.5;S.view='onboard';render();};
    const db=document.createElement('button'); db.textContent='✕'; db.style.cssText='background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;padding:0 4px;'; db.onclick=()=>{S.goals.splice(i,1);render();};
    btns.appendChild(eb); btns.appendChild(db); top.appendChild(left); top.appendChild(btns); row.appendChild(top);
    if(g.trigger) row.appendChild(p(`font-size:12px;color:${T.muted};`,`📍 ${g.trigger}`));
    wrap.appendChild(row);
  });

  const maxGoals = currentUser?.id === 'fa3dfb7f-2127-4554-a3e4-e8e80d55b21b' ? 20 : 5;
if(S.goals.length<maxGoals){
    const ab=document.createElement('button'); ab.style.cssText=`width:100%;padding:14px;background:none;border:1.5px dashed ${T.border};border-radius:14px;font-size:14px;color:${T.muted};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;`; ab.textContent=L('addGoal'); ab.onclick=()=>{S.goals.push({icon:'🎯',name:'',trigger:'',actions:[''],avoid:''});S.editIdx=S.goals.length-1;S.step=3.5;S.view='onboard';render();};
    wrap.appendChild(ab);
  }

  // restore code display — only show if not logged in
  // language toggle
  const langWrap = div('margin-top:16px;');
  const langLabel = p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;`, S.lang==='ko'?'언어 설정':'Language');
  const langRow = div('display:flex;gap:8px;');
  ['en','ko'].forEach(l => {
    const lb = document.createElement('button');
    lb.style.cssText=`flex:1;padding:10px;border-radius:12px;border:1.5px solid ${S.lang===l?T.green:T.border};background:${S.lang===l?T.gl:'#fff'};color:${S.lang===l?T.green:T.tm};font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;`;
    lb.textContent = l==='ko'?'한국어':'English';
    lb.onclick=()=>{ S.lang=l; localStorage.setItem('tb_lang',l); saveState(); render(); };
    langRow.appendChild(lb);
  });
  langWrap.appendChild(langLabel);
  langWrap.appendChild(langRow);
  wrap.appendChild(langWrap);

  if (!currentUser) {
    const warn = div(`background:${T.ol};border-radius:14px;padding:12px 16px;margin-top:16px;display:flex;gap:10px;align-items:flex-start;`);
    warn.innerHTML=`<span style="font-size:16px;">⚠️</span><div><p style="font-size:13px;font-weight:500;color:${T.orange};margin-bottom:2px;">${S.lang==='ko'?'데이터가 저장되지 않아요':'Your data is not being saved'}</p><p style="font-size:12px;color:${T.tm};line-height:1.5;">${S.lang==='ko'?'로그인하면 어느 기기에서나 데이터에 접근할 수 있어요.':'Sign in to save your data and access it from any device.'}</p></div>`;
    wrap.appendChild(warn);
  }

  // reset
  const resetWrap = div('margin-top:16px;padding-top:16px;border-top:1px solid #EAE6DE;');
  const resetBtn = document.createElement('button');
  resetBtn.style.cssText=`width:100%;padding:12px;background:none;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;color:#94a3b8;cursor:pointer;font-family:'DM Sans',sans-serif;`;
  resetBtn.textContent=L('resetAll');
  resetBtn.onclick=()=>{
    // show warning screen
    const overlay = div('position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;');
    const sheet = div(`background:#fff;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:390px;`);
    sheet.innerHTML = `
      <p style="font-size:22px;text-align:center;margin-bottom:12px;">⚠️</p>
      <p style="font-family:'Fraunces',serif;font-size:20px;font-weight:400;color:#1A1A1A;text-align:center;margin-bottom:8px;">${S.lang==='ko'?'모든 데이터를 삭제할까요?':'Delete all data?'}</p>
      <p style="font-size:13px;color:#909090;text-align:center;line-height:1.6;margin-bottom:24px;">${S.lang==='ko'?'목표, 기록, 분석 결과가 모두 삭제돼요. 이 작업은 되돌릴 수 없어요.':'All goals, logs, and analyses will be permanently deleted. This cannot be undone.'}</p>
    `;
    const deleteBtn = document.createElement('button');
    deleteBtn.style.cssText=`width:100%;padding:14px;background:#C84B3A;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:10px;`;
    deleteBtn.textContent = S.lang==='ko'?'모두 삭제하기':'Delete everything';
    deleteBtn.onclick=async()=>{
      // delete from Supabase if logged in
      if (supabase && currentUser) {
        await supabase.from('logs').delete().eq('user_id', currentUser.id);
        await supabase.from('analyses').delete().eq('user_id', currentUser.id);
        await supabase.from('goals').delete().eq('user_id', currentUser.id);
        await supabase.from('profiles').delete().eq('id', currentUser.id);
      }
      clearState();
      S={view:'onboard',step:0,lang:S.lang,parent:'',child:'',age:'',goals:[],editIdx:null,goalStep:1,logGoalIdx:0,logs:[],analyses:[],isDemo:false,tempLog:{}};
      document.body.removeChild(overlay);
      render();
    };
    const cancelBtn = document.createElement('button');
    cancelBtn.style.cssText=`width:100%;padding:14px;background:none;border:1.5px solid ${T.border};border-radius:14px;font-size:15px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;`;
    cancelBtn.textContent = S.lang==='ko'?'취소':'Cancel';
    cancelBtn.onclick=()=>document.body.removeChild(overlay);
    sheet.appendChild(deleteBtn);
    sheet.appendChild(cancelBtn);
    overlay.appendChild(sheet);
    overlay.onclick=(e)=>{ if(e.target===overlay) document.body.removeChild(overlay); };
    document.body.appendChild(overlay);
  };
  resetWrap.appendChild(resetBtn);

  // sign out / account section
  const accountWrap = div('margin-top:12px;');
  const user = currentUser;
  if (user) {
    const signOutBtn = document.createElement('button');
    signOutBtn.style.cssText=`width:100%;padding:12px;background:none;border:1px solid ${T.border};border-radius:12px;font-size:13px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:space-between;`;
    signOutBtn.innerHTML=`<span style="font-size:12px;color:${T.muted};">✓ ${currentUser.email}</span><span>Sign out</span>`;
    signOutBtn.onclick = async () => {
      if (supabase) await supabase.auth.signOut();
      currentUser = null;
      localStorage.removeItem('tb_was_logged_in');
      S = {view:'onboard', step:0, lang:S.lang, parent:'', child:'', age:'', goals:[], editIdx:null, goalStep:1, logGoalIdx:0, logs:[], analyses:[], isDemo:false, tempLog:{}};
      render();
    };
    accountWrap.appendChild(signOutBtn);
  } else {
    const siBox = div(`background:${T.card};border-radius:14px;border:1px solid ${T.border};padding:14px 16px;`);
    siBox.innerHTML=`<p style="font-size:13px;font-weight:500;color:${T.tm};margin-bottom:4px;">Create a free account</p><p style="font-size:12px;color:${T.muted};margin-bottom:10px;">Save your data and access it from any device.</p>`;

    const googleBtn = document.createElement('button');
    googleBtn.style.cssText=`width:100%;padding:10px;background:#fff;color:#1A1A1A;border:1.5px solid ${T.border};border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;`;
    googleBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A353" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>Sign in with Google`;
    googleBtn.onclick = signInWithGoogle;
    const bn2=document.createElement("p");bn2.style.cssText="font-size:11px;color:#909090;text-align:center;margin-bottom:8px;line-height:1.6;";bn2.textContent=S.lang==="ko"?"카카오톡 등 메신저에서 열었다면 외부 브라우저로 열어주세요":"If opened from a messenger app, please open in Safari or Chrome";wrap.appendChild(bn2);

    const orDiv = div('display:flex;align-items:center;gap:8px;margin-bottom:8px;');
    orDiv.innerHTML=`<div style="flex:1;height:1px;background:${T.border}"></div><p style="font-size:11px;color:${T.muted}">or</p><div style="flex:1;height:1px;background:${T.border}"></div>`;

    const emailInp = document.createElement('input');
    emailInp.type='email'; emailInp.placeholder='your@email.com';
    emailInp.style.cssText=`width:100%;padding:10px 12px;border:1.5px solid ${T.border};border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;margin-bottom:8px;outline:none;`;

    const siBtn = document.createElement('button');
    siBtn.style.cssText=`width:100%;padding:10px;background:${T.green};color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;`;
    siBtn.textContent='Send sign-in link to my email →';

    const siMsg = p(`font-size:12px;color:${T.gm};margin-top:6px;display:none;`,'');
    siBtn.onclick = async () => {
      const email = emailInp.value.trim();
      if (!email) return;
      siBtn.textContent = 'Sending...'; siBtn.disabled = true;
      const { error } = await signInWithMagicLink(email);
      if (error) {
        siBtn.textContent = 'Send sign-in link →'; siBtn.disabled = false;
        siMsg.textContent = '✗ Something went wrong.'; siMsg.style.color = T.red;
      } else {
        siMsg.textContent = '✓ Link sent! Check your email.'; siMsg.style.color = T.green;
      }
      siMsg.style.display = 'block';
    };

    siBox.appendChild(googleBtn);
    siBox.appendChild(orDiv);
    siBox.appendChild(emailInp);
    siBox.appendChild(siBtn);
    siBox.appendChild(siMsg);
    accountWrap.appendChild(siBox);
  }
  wrap.appendChild(accountWrap);

  wrap.appendChild(resetWrap);
  return wrap;
}

// ── RENDER ─────────────────────────────────────────────────────────
function render() {
  const screenEl=document.getElementById('screen');
  screenEl.innerHTML='';
  let content;
  if(S.view==='onboard') content=renderOnboard();
  else if(S.view==='home') content=renderHome();
  else if(S.view==='log') content=renderLog();
  else if(S.view==='week') content=renderWeek();
  else if(S.view==='goals') content=renderGoals();
  else if(S.view==='report') content=renderReport();
  if(content) screenEl.appendChild(content);
  renderNav();
}

initSupabaseAndRender();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW error:', e));
}
</script>
</body>
</html>
