<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* Force DM Sans for all non-Fraunces elements to prevent Korean text rendering issues */
*:not([style*="Fraunces"]) { font-family: inherit; }
.card-avoid, .card-avoid * { font-family: 'DM Sans', sans-serif !important; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #1a1a1a;
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0;
}
.phone {
  width: 100%;
  max-width: 390px;
  height: 100dvh;
  background: #F8F6F2;
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 40px 120px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  position: relative;
}
.status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #F8F6F2; flex-shrink: 0; }
.status span { font-size: 13px; font-weight: 500; color: #555; }
.screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; min-height: 0; }
.screen::-webkit-scrollbar { display: none; }
.nav { height: 80px; background: #fff; border-top: 1px solid #EAE6DE; display: flex; align-items: center; justify-content: space-around; padding: 0 8px 14px; flex-shrink: 0; position: relative; z-index: 10; }
.nav-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: 'DM Sans', sans-serif; font-size: 10px; color: #aaa; padding: 4px 12px; transition: color 0.2s; }
.nav-btn.active { color: #2D5A3D; font-weight: 500; }
.nav-dot { width: 4px; height: 4px; border-radius: 2px; background: #2D5A3D; }

/* tokens */
:root {
  --green: #2D5A3D; --gl: #EAF2EC; --gm: #4A8C60;
  --text: #1A1A1A; --tm: #4A4A4A; --muted: #909090;
  --border: #EAE6DE; --card: #fff; --bg: #F8F6F2;
  --red: #C84B3A; --rl: #FDECEA;
  --orange: #D4622A; --ol: #FDF0EA;
}

/* shared */
.serif { font-family: 'Fraunces', serif; font-weight: 400; }
.pad { padding: 24px 22px; }
.label { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px; }
.card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 10px; }

/* inputs */
input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%; padding: 13px 15px; font-size: 14px;
  border: 1.5px solid var(--border); border-radius: 13px;
  background: #fff; outline: none; font-family: 'DM Sans', sans-serif;
  color: var(--text); transition: border-color .2s; margin-bottom: 10px;
}
input:focus, textarea:focus, select:focus { border-color: var(--green); }
textarea { resize: none; height: 60px; line-height: 1.5; }

/* buttons */
.btn { width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:disabled { background: var(--border); color: var(--muted); cursor: default; }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--tm); }

/* progress dots */
.dots { display: flex; gap: 5px; margin-bottom: 32px; }
.dot { height: 4px; border-radius: 2px; flex: 1; background: var(--border); transition: all .3s; }
.dot.on { background: var(--green); flex: 2; }

/* radio chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; color: var(--tm); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .15s; }
.chip.on { border-color: var(--green); background: var(--gl); color: var(--green); font-weight: 500; }

/* goal cards */
.goal-card { border-radius: 22px; padding: 20px 22px; margin-bottom: 12px; cursor: pointer; position: relative; overflow: hidden; }
.goal-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.06); }

/* stat cards */
.stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
.stat { flex: 1; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 12px; text-align: center; }
.stat-val { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text); }
.stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* week goal card */
.wk-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 12px; }
.progress-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin: 8px 0 5px; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }

/* toast */
.toast { background: var(--gl); border-radius: 13px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.toast p { font-size: 13px; color: var(--green); font-weight: 500; }
</style>

<script>
const T = { green:'#2D5A3D',gl:'#EAF2EC',gm:'#4A8C60',text:'#1A1A1A',tm:'#4A4A4A',muted:'#909090',border:'#EAE6DE',card:'#fff',bg:'#F8F6F2',red:'#C84B3A',rl:'#FDECEA',orange:'#D4622A',ol:'#FDF0EA' };
const CARD_COLORS = ['#2D5A3D','#1a6b8a','#7a4a2d','#5a3a7a','#3a6a4a'];
const STORAGE_KEY = 'therapy_buddy_v1';

// ── SUPABASE ─────────────────────────────────────────────────────────
let supabase = null;
let currentUser = null;

async function initSupabase() {
  try {
    const res = await fetch('/.netlify/functions/config');
    if (!res.ok) throw new Error('Config fetch failed');
    const { supabaseUrl, supabaseKey } = await res.json();

    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(supabaseUrl, supabaseKey, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true,
        storage: window.localStorage,
        storageKey: 'tb_supabase_auth',
      }
    });

    // BroadcastChannel — if this is the new tab from magic link
    const authChannel = new BroadcastChannel('tb_auth');

    // check if this tab has a token (magic link tab)
    const hasToken = window.location.hash.includes('access_token') ||
                     window.location.search.includes('code=') ||
                     window.location.search.includes('token=');

    if (hasToken) {
      document.body.style.cssText = 'font-family:"DM Sans",sans-serif;background:#1a1a1a;min-height:100dvh;display:flex;align-items:center;justify-content:center;margin:0;padding:0;';
      document.body.innerHTML = `
        <div style="width:100%;max-width:390px;height:100dvh;background:#F8F6F2;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;box-shadow:0 40px 120px rgba(0,0,0,.5);overflow-y:auto;">
          <div style="width:80px;height:80px;border-radius:62% 38% 70% 30%/45% 65% 35% 55%;background:linear-gradient(140deg,#4A8C60,#2D5A3D);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;">🌿</div>
          <p style="font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:#2D5A3D;margin-bottom:8px;text-align:center;">로그인 성공! Signed in!</p>
          <p style="font-size:14px;color:#909090;margin-bottom:28px;text-align:center;line-height:1.6;">데이터가 준비됐어요.<br>Your data is ready.</p>

          <div style="background:#fff;border-radius:16px;border:1px solid #EAE6DE;padding:16px 18px;width:100%;margin-bottom:20px;">
            <p style="font-size:12px;font-weight:500;color:#1A1A1A;margin-bottom:10px;">📱 홈 화면에 추가하면 더 편해요</p>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="background:#F8F6F2;border-radius:10px;padding:10px 12px;">
                <p style="font-size:12px;font-weight:500;color:#2D5A3D;margin-bottom:3px;">🍎 아이폰</p>
                <p style="font-size:12px;color:#4A4A4A;line-height:1.5;">Safari에서 therapybuddy.org 열기 → 공유(□↑) → 홈 화면에 추가</p>
              </div>
              <div style="background:#F8F6F2;border-radius:10px;padding:10px 12px;">
                <p style="font-size:12px;font-weight:500;color:#2D5A3D;margin-bottom:3px;">🤖 안드로이드</p>
                <p style="font-size:12px;color:#4A4A4A;line-height:1.5;">Chrome에서 therapybuddy.org 열기 → ⋮ → 홈 화면에 추가</p>
              </div>
            </div>
          </div>

          <a href="https://therapybuddy.org" style="display:block;width:100%;padding:14px;background:#2D5A3D;color:#fff;border-radius:14px;font-size:15px;font-weight:500;text-align:center;text-decoration:none;font-family:'DM Sans',sans-serif;">앱으로 이동 · Go to App →</a>
        </div>`;
      setTimeout(async () => {
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          authChannel.postMessage({ type: 'SIGNED_IN', session: data.session });
        }
      }, 1000);
      return;
    }

    // original tab — listen for auth from magic link tab
    authChannel.onmessage = async (event) => {
      if (event.data.type === 'SIGNED_IN') {
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          currentUser = data.session.user;
          await loadFromSupabase();
          render();
        }
      }
    };

    // check existing session
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      await loadFromSupabase();
    } else {
      // no active session — if localStorage has data from a logged-in account, clear it
      const wasLoggedIn = localStorage.getItem('tb_was_logged_in');
      if (wasLoggedIn) {
        S.parent = ''; S.child = ''; S.age = '';
        S.goals = []; S.logs = []; S.analyses = [];
        S.view = 'onboard';
        localStorage.removeItem('tb_was_logged_in');
      }
    }

    // listen for auth changes
    supabase.auth.onAuthStateChange(async (event, session) => {
      console.log('Auth event:', event, session?.user?.email);
      if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        localStorage.setItem('tb_was_logged_in', '1');
        // reset state before loading from Supabase
        S.parent = ''; S.child = ''; S.age = '';
        S.goals = []; S.logs = []; S.analyses = [];
        S.view = 'onboard'; S.step = 0;
        await loadFromSupabase();
        render();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        render();
      }
    });

  } catch(e) {
    console.log('Supabase init failed:', e);
  }
}

async function initSupabaseAndRender() {
  await initSupabase();
  render();
}

async function signInWithGoogle() {
  if (!supabase) return;
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://therapybuddy.org/auth/callback'
    }
  });
  if (error) console.log('Google sign in error:', error);
}

async function signInWithMagicLink(email) {
  if (!supabase) return { error: 'Not initialized' };
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: 'https://therapybuddy.org/auth/callback',
      shouldCreateUser: true,
    }
  });
  return { error };
}

async function signOut() {
  if (!supabase) return;
  await supabase.auth.signOut();
  currentUser = null;
  render();
}

async function saveToSupabase() {
  if (!supabase || !currentUser) {
    console.log('saveToSupabase: no supabase or user', supabase, currentUser);
    return;
  }
  try {
    console.log('Saving to Supabase, user:', currentUser.id);
    // upsert profile
    const { error: profileError } = await supabase.from('profiles').upsert({
      id: currentUser.id,
      parent_name: S.parent,
      child_name: S.child,
      child_age: S.age,
      lang: S.lang
    });
    if (profileError) console.log('Profile error:', profileError);
    else console.log('Profile saved!');

    // upsert goals
    for (const g of S.goals) {
      const { error: goalError } = await supabase.from('goals').upsert({
        id: g.goal_id,
        user_id: currentUser.id,
        goal_number: g.goal_number,
        icon: g.icon,
        name: g.name,
        trigger: g.trigger,
        actions: g.actions,
        avoid: g.avoid,
        goal_version: g.goal_version
      });
      if (goalError) console.log('Goal error:', goalError);
      else console.log('Goal saved:', g.name);
    }

    // save analyses
    for (let i = 0; i < S.goals.length; i++) {
      const a = S.analyses?.[i];
      if (!a) continue;
      const { error: analysisError } = await supabase.from('analyses').upsert({
        user_id: currentUser.id,
        goal_id: S.goals[i].goal_id,
        working: a.working || [],
        not_working: a.not_working || [],
        next_actions: a.next_actions || [],
        avoid: a.avoid || []
      });
      if (analysisError) console.log('Analysis error:', analysisError);
    }
  } catch(e) {
    console.log('Supabase save failed:', e);
  }
}

async function saveLogToSupabase(log, goalId) {
  if (!supabase || !currentUser) return;
  try {
    await supabase.from('logs').insert({
      user_id: currentUser.id,
      goal_id: goalId,
      goal_name: log.goalName,
      date: log.date,
      caregiver: log.caregiver,
      before_state: log.before,
      attempted: log.attempted,
      technique: log.technique,
      worked: log.worked,
      didnt_work: log.didnt_work,
      reaction: log.reaction,
      outcome: log.outcome,
      next: log.next
    });
  } catch(e) {
    console.log('Log save failed:', e);
  }
}

async function loadFromSupabase() {
  if (!supabase || !currentUser) return;
  try {
    const { data: profile } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    if (profile && profile.parent_name) {
      // existing Supabase user
      S.parent = profile.parent_name || '';
      S.child = profile.child_name || '';
      S.age = profile.child_age || '';
      S.lang = profile.lang || 'en';

      const { data: goals } = await supabase
        .from('goals').select('*')
        .eq('user_id', currentUser.id)
        .order('goal_number');

      if (goals && goals.length > 0) {
        S.goals = goals.map(g => ({
          goal_id: g.id,
          goal_number: g.goal_number,
          goal_version: g.goal_version,
          icon: g.icon,
          name: g.name,
          trigger: g.trigger,
          actions: g.actions || [],
          avoid: g.avoid
        }));
      }

      const { data: logs } = await supabase
        .from('logs').select('*')
        .eq('user_id', currentUser.id)
        .order('created_at');

      if (logs) {
        S.logs = logs.map(l => ({
          goalIdx: S.goals.findIndex(g => g.goal_id === l.goal_id),
          date: l.date,
          caregiver: l.caregiver,
          before: l.before_state,
          attempted: l.attempted,
          technique: l.technique,
          worked: l.worked,
          didnt_work: l.didnt_work,
          reaction: l.reaction,
          outcome: l.outcome,
          next: l.next
        }));
      }

      const { data: analyses } = await supabase
        .from('analyses').select('*')
        .eq('user_id', currentUser.id);

      if (analyses) {
        S.analyses = [];
        analyses.forEach(a => {
          const idx = S.goals.findIndex(g => g.goal_id === a.goal_id);
          if (idx >= 0) S.analyses[idx] = {
            working: a.working,
            not_working: a.not_working,
            next_actions: a.next_actions,
            avoid: a.avoid,
            date: new Date(a.created_at).toLocaleDateString(S.lang==='ko'?'ko-KR':'en-US')
          };
        });
      }

      S.view = 'home';

    } else {
      // no Supabase profile — new user, go to onboarding
      S.view = 'onboard';
      S.step = 1; // skip step 0, already logged in
    }
  } catch(e) {
    console.log('Supabase load failed:', e);
    // fallback — if S already has data, go to home
    if (S.parent) S.view = 'home';
  }
}

}

// 6-char alphanumeric code derived from user ID — easy to write down
function getRestoreCode() {
  const uid = USER_ID;
  let code = '';
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let i = 0; i < 6; i++) {
    code += chars[uid.charCodeAt(i % uid.length) % chars.length];
  }
  return code;
}

// ── STATS ──────────────────────────────────────────────────────────
function stats(idx) {
  const logs = S.logs.filter(l => l.goalIdx === idx && l.attempted === 'Yes');
  const total = logs.length;
  if (!total) return { total:0, rate:0, partialRate:0, posRate:0, status:'none', worked:[], next:[] };
  const succ = logs.filter(l => l.outcome === 'Success').length;
  const part = logs.filter(l => l.outcome === 'Partial success').length;
  const pos = logs.filter(l => l.reaction === 'Positive').length;
  const rate = Math.round(succ/total*100);
  const partialRate = Math.round(part/total*100);
  const posRate = Math.round(pos/total*100);
  const status = rate >= 50 ? 'high' : (rate >= 25 || (rate+partialRate) >= 50) ? 'mid' : 'low';
  return { total, rate, partialRate, posRate, status, worked: logs.filter(l=>l.worked).map(l=>l.worked), next: logs.filter(l=>l.next).map(l=>l.next) };
}

function statusCfg(s) {
  if (s==='high') return { color:T.green, bg:T.gl, label:L('workingWell'), emoji:'↑', tip:L('workingWellTip') };
  if (s==='mid') return { color:T.orange, bg:T.ol, label:L('someProgress'), emoji:'→', tip:L('someProgressTip') };
  if (s==='low') return { color:T.red, bg:T.rl, label:L('notWorking'), emoji:'↓', tip:L('notWorkingTip') };
  return { color:T.muted, bg:T.border, label:'No data yet', emoji:'–', tip:'Log results to see patterns here.' };
}

      siBtn.textContent = S.lang==='ko' ? '전송 중...' : 'Sending...';
      siBtn.disabled = true;
      const { error } = await signInWithMagicLink(email);
      if (error) {
        siBtn.textContent = S.lang==='ko' ? '이메일로 로그인 링크 받기 →' : 'Send sign-in link to my email →';
        siBtn.disabled = false;
        sentMsg.textContent = S.lang==='ko' ? '✗ 오류가 발생했어요. 다시 시도해주세요.' : '✗ Something went wrong. Try again.';
        sentMsg.style.color = T.red;
      } else {
        sentMsg.textContent = S.lang==='ko' ? '✓ 이메일을 확인하고 링크를 탭하세요!' : '✓ Link sent! Check your email and tap the link to sign in.';
        sentMsg.style.color = T.green;
      }
      sentMsg.style.display = 'block';
    };
    wrap.appendChild(siBtn);

    const sentMsg = p(`font-size:12px;color:${T.gm};margin-top:8px;display:none;`, '');
    wrap.appendChild(sentMsg);

    // skip button
    const skipBtn = document.createElement('button');
    skipBtn.style.cssText = `background:none;border:none;width:100%;padding:14px;font-size:13px;color:${T.muted};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;`;
    skipBtn.textContent = S.lang==='ko' ? '나중에 할게요 →' : 'Skip for now →';
    skipBtn.onclick = () => go('home');
    wrap.appendChild(skipBtn);
  }

  return wrap;
}

function updateBtn() {
  const btn=document.getElementById('cont-btn'); if(!btn) return;
  let ok=false;
  if(S.step===1) ok=S.parent.trim().length>0;
  else if(S.step===2) ok=S.child.trim().length>0&&S.age.toString().length>0;
  else if(S.step===3.5) ok=(S.goals[S.editIdx]?.name||'').trim().length>0;
  btn.disabled=!ok;
  btn.style.background=ok?T.green:T.border;
  btn.style.color=ok?'#fff':T.muted;
  btn.style.cursor=ok?'pointer':'default';
}

// ── HOME ───────────────────────────────────────────────────────────
function renderHome() {

  wrap.appendChild(greet);

  // demo banner
  if(S.isDemo) {

    exitBtn.onclick = () => {
      S = { view:'onboard', step:0, parent:'', child:'', age:'', goals:[], editIdx:null, logGoalIdx:0, logs:[], tempLog:{}, isDemo:false };

    banner.appendChild(exitBtn);
    wrap.appendChild(banner);

  if(S.goals.length===0){
    const empty=div(`background:${T.gl};border-radius:20px;padding:24px;text-align:center;`);
    empty.innerHTML=`<p style="font-size:28px;margin-bottom:10px">🌿</p><p style="font-family:'Fraunces',serif;font-size:20px;color:${T.green};margin-bottom:8px">${L('noGoalsTitle')}</p><p style="font-size:13px;color:${T.gm};line-height:1.6">${L('noGoalsDesc',S.child)}</p>`;
    const gb=document.createElement('button'); gb.className='btn btn-primary'; gb.style.marginTop='14px'; gb.textContent=L('setUpGoals'); gb.onclick=()=>go('goals');
    empty.appendChild(gb); wrap.appendChild(empty);
  } else {
    // vent button
    const ventBtn = div(`background:#fff;border-radius:16px;border:1.5px solid ${T.border};padding:14px 16px;margin-bottom:16px;cursor:pointer;display:flex;align-items:center;gap:12px;`);
    ventBtn.innerHTML=`
      <span style="font-size:22px;">💭</span>
      <div>
        <p style="font-size:14px;font-weight:500;color:${T.text};margin-bottom:2px;">${S.lang==='ko'?'오늘 힘든 일이 있었나요?':'Need to get something off your chest?'}</p>
        <p style="font-size:12px;color:${T.muted};">${S.lang==='ko'?'자유롭게 털어놓으세요 →':'Drop a note — we\'ll help you make sense of it →'}</p>
      </div>
    `;
    ventBtn.onmouseenter = () => ventBtn.style.borderColor = T.green;
    ventBtn.onmouseleave = () => ventBtn.style.borderColor = T.border;
    ventBtn.onclick = () => { S.tempLog = {noteMode:'drop', mode:'diary', fromHome:true}; go('log'); };
    wrap.appendChild(ventBtn);

    const tl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;`,L('todayCards'));
    wrap.appendChild(tl);
    S.goals.forEach((g,i)=>{
      const st=stats(i); const c=CARD_COLORS[i%CARD_COLORS.length];
      const analysis = S.analyses && S.analyses[i];

      const card=div(`background:${c};border-radius:22px;padding:20px 22px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif;`);
      const logged=S.logs.filter(l=>l.goalIdx===i&&l.attempted==='Yes').length;
      card.innerHTML=`
        <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05)"></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;color:rgba(255,255,255,.92)">${g.icon} ${S.lang==='ko'?'목표':'Goal'} ${i+1}</span>
          <span style="font-size:12px;color:rgba(255,255,255,.5)">${logged>0?(S.lang==='ko'?`성공률 ${st.rate}%`:`${st.rate}% success`):L('tapToLog')}</span>
        </div>
        <p style="font-family:${S.lang==='ko'?'\'DM Sans\',sans-serif':'\'Fraunces\',serif'};font-size:19px;font-weight:400;color:#fff;line-height:1.3;margin-bottom:8px">${g.name}</p>
        <p style="font-size:12px;color:rgba(255,255,255,.65);margin-bottom:12px;font-family:'DM Sans',sans-serif;">📍 ${g.trigger}</p>
      `;

      // show analysis inside card if available, otherwise show actions
      if(analysis) {
        const updatedLabel = document.createElement('p');
        updatedLabel.style.cssText = `font-size:10px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;font-family:'DM Sans',sans-serif;`;
        updatedLabel.textContent = (S.lang==='ko' ? '업데이트 ' : 'Updated ') + (analysis.date||'');
        card.appendChild(updatedLabel);

        if(analysis.working?.length) {
          const wRow = div('display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;');
          wRow.innerHTML = `<span style="color:rgba(255,255,255,.7);font-size:12px;">✓</span><p style="font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;font-family:'DM Sans',sans-serif;">${analysis.working[0]}</p>`;
          card.appendChild(wRow);
        }

        if(analysis.next_actions?.length) {
          const na = div('display:flex;flex-direction:column;gap:5px;margin-top:4px;');
          analysis.next_actions.slice(0,2).forEach((a,ai) => {
            const row = div('display:flex;gap:8px;align-items:flex-start;');
            row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:1px">${ai+1}</div><p style="font-size:12px;color:rgba(255,255,255,.9);line-height:1.5;font-family:'DM Sans',sans-serif;">${a}</p>`;
            na.appendChild(row);
          });
          card.appendChild(na);
        }

        // avoid
        if(g.avoid) {
          const avoidBox = document.createElement('div');
          avoidBox.style.cssText = `margin-top:10px;background:rgba(0,0,0,.15);border-radius:8px;padding:6px 10px;font-size:11px;color:rgba(255,255,255,.8);font-family:'DM Sans',sans-serif;`;
          const avoidLabel = document.createElement('strong');
          avoidLabel.style.fontFamily = "'DM Sans',sans-serif";
          avoidLabel.textContent = (S.lang==='ko'?'피해야 할 것':'Avoid') + ': ';
          avoidBox.appendChild(avoidLabel);
          avoidBox.appendChild(document.createTextNode(g.avoid));
          card.appendChild(avoidBox);
        }

        // see full analysis link
        const weekBtn = document.createElement('button');
        weekBtn.style.cssText=`background:none;border:none;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;padding:0;text-decoration:underline;`;
        weekBtn.textContent = L('seeFullAnalysis');
        weekBtn.onclick=(e)=>{ e.stopPropagation(); go('week'); };
        card.appendChild(weekBtn);

      } else {
        // no analysis yet — show action steps
        const stepsDiv = div('display:flex;flex-direction:column;gap:5px;');
        stepsDiv.innerHTML = g.actions.slice(0,2).map((a,ai)=>`<div style="display:flex;gap:8px;align-items:flex-start"><div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:1px">${ai+1}</div><p style="font-size:12px;color:rgba(255,255,255,.9);line-height:1.5;font-family:'DM Sans',sans-serif;">${a}</p></div>`).join('');
        if(g.actions.length>2) {
          const more = document.createElement('p');
          more.style.cssText = 'font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;';
          more.textContent = `+${g.actions.length-2} more steps`;
          stepsDiv.appendChild(more);
        }
        card.appendChild(stepsDiv);

        if(g.avoid) {
          const avoidBox = document.createElement('div');
          avoidBox.style.cssText = `margin-top:10px;background:rgba(0,0,0,.15);border-radius:8px;padding:6px 10px;font-size:11px;color:rgba(255,255,255,.8);font-family:'DM Sans',sans-serif;`;
          const avoidLabel = document.createElement('strong');
          avoidLabel.style.fontFamily = "'DM Sans',sans-serif";
          avoidLabel.textContent = (S.lang==='ko'?'피해야 할 것':'Avoid') + ': ';
          avoidBox.appendChild(avoidLabel);
          avoidBox.appendChild(document.createTextNode(g.avoid));
          card.appendChild(avoidBox);
        }
      }

      card.onclick=()=>{S.logGoalIdx=i;S.tempLog={noteMode:'goal'};go('log');};
      wrap.appendChild(card);
    });
  }

  return wrap;
}

// ── LOG ────────────────────────────────────────────────────────────
function renderLog() {
  // voice input helper
  function addVoiceBtn(input, onResult) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;

    const btn = document.createElement('button');
    btn.style.cssText=`background:none;border:1.5px solid ${T.border};border-radius:10px;padding:8px 10px;font-size:16px;cursor:pointer;flex-shrink:0;`;
    btn.textContent = '🎤';
    btn.title = S.lang==='ko'?'음성 입력':'Voice input';

    btn.onclick = () => {
      const rec = new SpeechRecognition();
      rec.lang = S.lang==='ko'?'ko-KR':'en-US';
      rec.continuous = false;
      rec.interimResults = false;
      btn.textContent = '🔴';
      btn.style.borderColor = T.red;
      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        const current = input.value || input.textContent || '';
        const newVal = current ? current + ' ' + transcript : transcript;
        if (input.tagName === 'TEXTAREA') input.value = newVal;
        else input.value = newVal;
        onResult(newVal);
        btn.textContent = '🎤';
        btn.style.borderColor = T.border;
      };
      rec.onerror = () => { btn.textContent = '🎤'; btn.style.borderColor = T.border; };
      rec.onend = () => { btn.textContent = '🎤'; btn.style.borderColor = T.border; };
      rec.start();
    };
    return btn;
  }

  function voiceRow(input, onResult) {
    const voiceBtn = addVoiceBtn(input, onResult);
    if (!voiceBtn) return input;
    const row = div('display:flex;gap:8px;align-items:flex-start;');
    input.style.flex = '1';
    row.appendChild(input);
    row.appendChild(voiceBtn);
    return row;
  }
  const goal = S.goals[S.logGoalIdx];
  const wrap = div('flex:1;overflow-y:auto;padding:20px 22px 32px;');

  // warm heading
  const dateStr = S.lang === 'ko'
    ? new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric'})
    : new Date().toLocaleDateString('en-US', {month:'long', day:'numeric'});
  const warmHead = div('margin-bottom:24px;');
  warmHead.innerHTML = `
    <p style="font-size:12px;color:${T.muted};margin-bottom:4px;">${dateStr}</p>
    <h2 style="font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:${T.text};line-height:1.3;">${S.lang==='ko'?'오늘 무슨 일이 있었나요?':'What\'s on your mind?'}</h2>
  `;
  wrap.appendChild(warmHead);

  // mode selector — only show if no mode chosen yet
  if (!S.tempLog.noteMode) {
    const opt1 = div(`background:#fff;border-radius:18px;border:1.5px solid ${T.border};padding:18px 20px;margin-bottom:12px;cursor:pointer;`);
    opt1.innerHTML = `
      <p style="font-size:16px;margin-bottom:6px;">🗒️</p>
      <p style="font-size:15px;font-weight:500;color:${T.text};margin-bottom:4px;">${S.lang==='ko'?'노트 남기기':'Drop a note'}</p>
      <p style="font-size:12px;color:${T.muted};line-height:1.5;">${S.lang==='ko'?'뭐든 자유롭게 — 정리는 AI가 해드릴게요. 문자나 이메일을 붙여넣어도 좋아요.':'Anything on your mind — we\'ll organize it. You can copy & paste from a text or email.'}</p>
    `;
    opt1.onclick = () => { S.tempLog.noteMode = 'drop'; S.tempLog.mode = 'diary'; render(); };

    const opt2 = div(`background:#fff;border-radius:18px;border:1.5px solid ${T.border};padding:18px 20px;margin-bottom:12px;cursor:pointer;`);
    opt2.innerHTML = `
      <p style="font-size:16px;margin-bottom:6px;">🎯</p>
      <p style="font-size:15px;font-weight:500;color:${T.text};margin-bottom:4px;">${S.lang==='ko'?'목표 관련 기록하기':'Log what happened'}</p>
      <p style="font-size:12px;color:${T.muted};line-height:1.5;">${S.lang==='ko'?'목표 중 하나와 관련된 일을 기록해요.':'Related to one of your goals.'}</p>
    `;
    opt2.onclick = () => { S.tempLog.noteMode = 'goal'; render(); };

    // hover effect
    [opt1, opt2].forEach(opt => {
      opt.onmouseenter = () => opt.style.borderColor = T.green;
      opt.onmouseleave = () => opt.style.borderColor = T.border;
    });

    wrap.appendChild(opt1);
    wrap.appendChild(opt2);
    return wrap;
  }

  // ── DROP A NOTE MODE ─────────────────────────────────────────────
  if (S.tempLog.noteMode === 'drop') {
    const backBtn = document.createElement('button');
    backBtn.style.cssText=`background:none;border:none;cursor:pointer;color:${T.tm};font-size:14px;margin-bottom:20px;padding:0;font-family:'DM Sans',sans-serif;`;
    backBtn.textContent = '← ' + (S.lang==='ko'?'뒤로':'Back');
    backBtn.onclick = () => {
      if (S.tempLog.fromHome) { S.tempLog = {}; go('home'); }
      else { S.tempLog = {}; render(); }
    };
    wrap.appendChild(backBtn);

    wrap.appendChild(h('h2', `font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:${T.text};margin-bottom:6px;`,
      S.lang==='ko'?'자유롭게 남겨주세요':'Drop a note'));
    wrap.appendChild(p(`font-size:13px;color:${T.muted};margin-bottom:16px;line-height:1.6;`,
      S.lang==='ko'
        ? '뭐든 괜찮아요 — 문자, 이메일, 오늘 있었던 일 모두. AI 가 정리해드릴게요.'
        : 'Anything goes — a text, an email, something that happened. We will organize it for you.'));

    const guideBox = div(`background:${T.gl};border-radius:12px;padding:12px 14px;margin-bottom:14px;`);
    guideBox.innerHTML = `
      <p style="font-size:12px;color:${T.green};line-height:1.7;margin-bottom:6px;">${S.lang==='ko'
        ? '💡 선생님 문자, 치료사 이메일, 오늘 있었던 일을 그대로 붙여넣어도 좋아요.'
        : '💡 Paste a text from your teacher, an email from your therapist, or just tell us what happened.'}</p>
      <p style="font-size:11px;color:${T.muted};line-height:1.5;">🔒 ${S.lang==='ko'?'노트는 본인만 볼 수 있어요.':'Your notes are private and only visible to you.'}</p>`;
    wrap.appendChild(guideBox);

    const diaryTA = document.createElement('textarea');
    diaryTA.value = S.tempLog.diary || '';
    diaryTA.placeholder = S.lang==='ko'
      ? '여기에 붙여넣거나 직접 입력하세요...'
      : 'Paste or type anything here...';
    diaryTA.style.cssText = `width:100%;min-height:180px;padding:12px 14px;border:1.5px solid ${T.border};border-radius:12px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;line-height:1.7;`;
    diaryTA.oninput = e => { S.tempLog.diary = e.target.value; };
    diaryTA.onblur = () => { if (S.tempLog.diary && S.tempLog.diary.length >= 10) render(); };
    diaryTA.onpaste = () => { setTimeout(() => { S.tempLog.diary = diaryTA.value; render(); }, 300); };
    // voice button
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const voiceBtn = document.createElement('button');
      voiceBtn.style.cssText=`width:100%;padding:12px;background:#fff;border:1.5px solid ${T.border};border-radius:12px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;`;
      voiceBtn.innerHTML = `<span style="font-size:20px;">🎤</span> ${S.lang==='ko'?'말하기':'Speak instead'}`;
      voiceBtn.onclick = () => {
        const rec = new SpeechRecognition();
        rec.lang = S.lang==='ko'?'ko-KR':'en-US';
        rec.continuous = true;
        rec.interimResults = true;
        voiceBtn.innerHTML = `<span style="font-size:20px;">🔴</span> ${S.lang==='ko'?'듣는 중... (탭해서 중지)':'Listening... (tap to stop)'}`;
        voiceBtn.style.borderColor = T.red;
        let final = S.tempLog.diary || '';
        rec.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
            else interim = e.results[i][0].transcript;
          }
          diaryTA.value = final + interim;
          S.tempLog.diary = final + interim;
        };
        let stopped = false;
        const stopRec = () => {
          if (stopped) return; stopped = true; rec.stop();
          voiceBtn.innerHTML = `<span style="font-size:20px;">🎤</span> ${S.lang==='ko'?'말하기':'Speak instead'}`;
          voiceBtn.style.borderColor = T.border;
          setTimeout(() => render(), 300);
        };
        rec.onend = stopRec;
        voiceBtn.onclick = stopRec;
        rec.start();
      };
      const dRow = div('display:flex;flex-direction:column;gap:0;');
      dRow.appendChild(diaryTA);
      dRow.appendChild(voiceBtn);
      wrap.appendChild(dRow);
    } else {
      wrap.appendChild(diaryTA);
    }

    // AI analyze button
    if (S.tempLog.diary && S.tempLog.diary.trim().length > 10) {
      if (S.tempLog.diaryParsed) {
        // empathy + save options
        if (S.tempLog.empathy) {
          const empathyBox = div(`background:${T.gl};border-radius:16px;padding:18px 20px;margin-top:16px;border-left:3px solid ${T.green};`);
          empathyBox.innerHTML = `<p style="font-size:15px;color:#2D5A3D;line-height:1.8;font-family:'Fraunces',serif;font-weight:400;">${S.tempLog.empathy}</p>`;
          wrap.appendChild(empathyBox);
        }

        // show matched goal or suggested goal
        const goalIdx = S.tempLog.goalIdx;
        const matchedGoal = goalIdx >= 0 ? S.goals[goalIdx] : null;

        if (matchedGoal) {
          const matchBox = div(`background:#fff;border-radius:14px;border:1px solid ${T.border};padding:12px 16px;margin-top:12px;`);
          matchBox.innerHTML = `<p style="font-size:11px;color:${T.muted};margin-bottom:6px;">${S.lang==='ko'?'관련 목표':'Related goal'}</p><p style="font-size:14px;font-weight:500;color:${T.text};">${matchedGoal.icon} ${matchedGoal.name}</p>`;
          wrap.appendChild(matchBox);
        } else if (S.tempLog.suggestedGoal) {
          const sg = S.tempLog.suggestedGoal;
          const suggestBox = div(`background:${T.ol};border-radius:14px;padding:14px 16px;margin-top:12px;`);
          suggestBox.innerHTML = `
            <p style="font-size:11px;font-weight:500;color:${T.orange};letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;">✨ ${S.lang==='ko'?'새 목표 제안':'Suggested new goal'}</p>
            <p style="font-size:14px;font-weight:500;color:${T.text};margin-bottom:4px;">${sg.name}</p>
            <p style="font-size:12px;color:${T.tm};line-height:1.5;margin-bottom:12px;">📍 ${sg.trigger || ''}</p>

            analyzeBtn.textContent = S.lang==='ko'?'✨ 정리해드릴게요':'✨ Let us organize this for you';
            analyzeBtn.disabled = false;
            if (e.name === 'AbortError') {
              alert(S.lang==='ko'?'시간이 초과됐어요. 다시 시도해주세요.':'Timed out. Please try again.');
            }
          }
        };
        wrap.appendChild(analyzeBtn);
      }
    }
    return wrap;
  }

  // ── FIELDS MODE ─────────────────────────────────────────────────
  wrap.appendChild(sectionTitle(L('beforeState', S.child)));
  const stateChips=[L('calm'),L('focused'),L('resistant'),L('transition')];
  const sc=div('display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;');
  stateChips.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.before===opt;b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.before=opt;render();};sc.appendChild(b);});
  wrap.appendChild(sc);

  // TREATMENT
  wrap.appendChild(sectionTitle(L('treatment')));
  const tl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`, S.lang==='ko'?'무엇을 시도했나요?':'What did you try?');
  wrap.appendChild(tl);
  const ti=document.createElement('input'); ti.type='text'; ti.value=S.tempLog.technique||''; ti.placeholder=S.lang==='ko'?'예: 멜로디 + 별명 불러주기':'e.g. Melody + nickname, bedtime recap...'; ti.oninput=e=>{S.tempLog.technique=e.target.value; S.tempLog.attempted='Yes';};
  wrap.appendChild(voiceRow(ti, v=>{ S.tempLog.technique=v; S.tempLog.attempted='Yes'; }));

  const wl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('whatWorked'));
  wrap.appendChild(wl);
  const wta=document.createElement('textarea'); wta.value=S.tempLog.worked||''; wta.placeholder=S.lang==='ko'?'예: 멜로디로 불렀더니 웃으면서 내려왔어요':'e.g. Dooli-doo melody — Ian giggled and came downstairs'; wta.oninput=e=>S.tempLog.worked=e.target.value;
  wrap.appendChild(voiceRow(wta, v=>S.tempLog.worked=v));

  const wdl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('whatDidntWork'));
  wrap.appendChild(wdl);
  const wdta=document.createElement('textarea'); wdta.value=S.tempLog.didnt_work||''; wdta.placeholder=S.lang==='ko'?'예: 이름 3번 불렀는데 완전 무시':'e.g. Calling name 3 times — Ian ignored completely'; wdta.oninput=e=>S.tempLog.didnt_work=e.target.value;
  wrap.appendChild(voiceRow(wdta, v=>S.tempLog.didnt_work=v));

  // AFTER
  wrap.appendChild(sectionTitle(L('afterResults')));
  const outcomeOpts=[L('success'),L('partial'),L('noSuccess')];
  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('outcome')));
  const oc=div('display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;');
  outcomeOpts.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.outcome===opt;b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.outcome=opt;render();};oc.appendChild(b);});
  wrap.appendChild(oc);

  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('changeNext')));
  const nta=document.createElement('textarea'); nta.value=S.tempLog.next||''; nta.placeholder='e.g. Try joining play first before calling'; nta.oninput=e=>S.tempLog.next=e.target.value; nta.style.marginBottom='20px';
  wrap.appendChild(voiceRow(nta, v=>S.tempLog.next=v));
  wrap.appendChild(nta);

  const hasResult=S.tempLog.technique||S.tempLog.outcome;
  const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.disabled=!hasResult; saveBtn.textContent=L('saveEntry');
  if(!hasResult) saveBtn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
  saveBtn.onclick=()=>{
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const d=new Date(); const date=`${d.getMonth()+1}/${d.getDate()}`;
    const newLog = {goalIdx:S.logGoalIdx,date,caregiver:'You',before:S.tempLog.before||'',attempted:S.tempLog.attempted||'',technique:S.tempLog.technique||'',worked:S.tempLog.worked||'',didnt_work:S.tempLog.didnt_work||'',reaction:S.tempLog.reaction||'',outcome:S.tempLog.outcome||'',next:S.tempLog.next||''};
    S.logs.push(newLog);
    S.tempLog={};
    saveState();
    // save to Supabase
    if (currentUser) {
      saveLogToSupabase({
        goalName: S.goals[S.logGoalIdx]?.name || '',
        date,
        caregiver: 'You',
        before: newLog.before,
        attempted: newLog.attempted,
        technique: newLog.technique,
        worked: newLog.worked,
        didnt_work: newLog.didnt_work,
        reaction: newLog.reaction,
        outcome: newLog.outcome,
        next: newLog.next,
      }, S.goals[S.logGoalIdx]?.goal_id || '');
    }
    // send to Google Sheet
    sendToSheet({
      user_id: USER_ID,
      session_id: SESSION_ID,
      goal_id: S.goals[S.logGoalIdx]?.goal_id || '',
      goal_version: S.goals[S.logGoalIdx]?.goal_version || 1,
      goal_number: S.goals[S.logGoalIdx]?.goal_number || (S.logGoalIdx + 1),
      parent: S.parent,
      child: S.child,
      childAge: S.age,
      goalName: S.goals[S.logGoalIdx]?.name || '',
      before: newLog.before,
      attempted: newLog.attempted,
      technique: newLog.technique,
      worked: newLog.worked,
      didnt_work: newLog.didnt_work,
      reaction: newLog.reaction,
      outcome: newLog.outcome,
      next: newLog.next,
    });
    const toast=div(`background:${T.gl};border-radius:13px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:12px;`);
    toast.innerHTML=`<span>✓</span><p style="font-size:13px;color:${T.green};font-weight:500">${L('loggedToast')}</p>`;
    wrap.appendChild(toast);
    setTimeout(()=>go('week'),1600);
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

// ── WEEK ───────────────────────────────────────────────────────────
function renderWeek() {
  const wrap=div('flex:1;overflow-y:auto;padding:24px 22px 32px;');
  const totalAtt=S.logs.filter(l=>l.attempted==='Yes').length;
  const totalSucc=S.logs.filter(l=>l.outcome==='Success').length;
  const overall=totalAtt?Math.round(totalSucc/totalAtt*100):0;

  const dateStr = S.lang === 'ko'
    ? new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric'})
    : new Date().toLocaleDateString('en-US', {month:'long', day:'numeric'});

  wrap.innerHTML=`<p style="font-size:12px;color:${T.muted};margin-bottom:4px">${dateStr}</p><h2 style="font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:${T.text};margin-bottom:6px">${L('weekTitle',S.child)}</h2>`;

  // warm summary — AI personalized
  const summaryBox = div(`background:${T.gl};border-radius:14px;padding:14px 16px;margin-bottom:16px;border-left:3px solid ${T.green};`);

  if (S.insightsSummary && S.insightsSummaryLang === S.lang) {
    summaryBox.innerHTML = `<p style="font-size:14px;color:#2D5A3D;line-height:1.8;font-family:'Fraunces',serif;font-weight:400;">${S.insightsSummary}</p>`;
  } else {
    const fallback = totalAtt === 0
      ? (S.lang==='ko' ? `${S.child}를 위한 목표들이 준비됐어요. 첫 번째 기록을 남겨보세요 🌿` : `Goals are set for ${S.child}. Start logging to see insights here 🌿`)
      : (S.lang==='ko' ? `${S.child}를 위해 매일 노력하고 계시네요 🌿` : `You're showing up for ${S.child} every day 🌿`);
    summaryBox.innerHTML = `<p style="font-size:14px;color:#2D5A3D;line-height:1.8;font-family:'Fraunces',serif;font-weight:400;">${fallback}</p>`;

    if (totalAtt > 0 && !S.insightsSummaryLoading) {
      S.insightsSummaryLoading = true;
      const summary = S.goals.map((g, i) => {
        const st = stats(i);
        const worked = S.logs.filter(l=>l.goalIdx===i&&l.worked).map(l=>l.worked).slice(0,2);
        return { goal: g.name, attempts: st.total, successRate: st.rate, worked };
      });
      fetch('/.netlify/functions/analyze', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ type: 'insights_summary', parent: S.parent, child: S.child, lang: S.lang, summary })
      }).then(r=>r.json()).then(data => {
        if (data.message) {
          S.insightsSummary = data.message;
          S.insightsSummaryLang = S.lang;
          S.insightsSummaryLoading = false;
          render();
        }
      }).catch(() => { S.insightsSummaryLoading = false; });
    }
  }
  wrap.appendChild(summaryBox);

  // report button — top
  if (totalAtt > 0) {
    const reportBtn = document.createElement('button');
    reportBtn.style.cssText=`width:100%;padding:12px;background:#fff;border:1.5px solid ${T.green};border-radius:14px;font-size:13px;font-weight:500;color:${T.green};cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;`;
    reportBtn.innerHTML=`<span>📋</span> ${S.lang==='ko'?'미팅 준비 리포트 생성':'Generate meeting prep report'}`;
    reportBtn.onclick=()=>go('report');
    wrap.appendChild(reportBtn);
  }

  if(totalAtt===0){
    const empty=div(`background:${T.card};border-radius:18px;border:1px solid ${T.border};padding:24px;text-align:center;`);
    empty.innerHTML=`<p style="font-size:32px;margin-bottom:12px">📊</p><p style="font-family:'Fraunces',serif;font-size:18px;color:${T.green};margin-bottom:8px">${L('noLogsTitle')}</p><p style="font-size:13px;color:${T.gm};line-height:1.6">${L('noLogsDesc')}</p>`;
    const lb=document.createElement('button'); lb.className='btn btn-primary'; lb.style.marginTop='14px'; lb.textContent=L('startLogging'); lb.onclick=()=>go('home');
    empty.appendChild(lb); wrap.appendChild(empty); return wrap;
  }

  // stats row
  const sr=div('display:flex;gap:10px;margin-bottom:20px;');
  [{v:`${totalAtt}`,l:L('attempts'),click:null},{v:`${overall}%`,l:L('overallSuccess'),click:null},{v:`${S.goals.length}`,l:L('goals'),click:()=>go('goals')}].forEach(s=>{const sc=div(`flex:1;background:${T.card};border-radius:14px;border:1px solid ${T.border};padding:12px;text-align:center;${s.click?'cursor:pointer;':''}`);sc.innerHTML=`<p style="font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:${T.text}">${s.v}</p><p style="font-size:11px;color:${s.click?T.green:T.muted};margin-top:3px">${s.l}${s.click?' →':''}</p>`;if(s.click)sc.onclick=s.click;sr.appendChild(sc);});
  wrap.appendChild(sr);

  // section label
  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;`, S.lang==='ko'?'목표별 인사이트':'Insights by Goal'));

  // per-goal accordion cards
  if (!S.expandedGoals) S.expandedGoals = {};

  S.goals.forEach((g,i)=>{
    const st=stats(i); const sc=statusCfg(st.status);
    const isExpanded = S.expandedGoals[i] === true; // default collapsed

    // accordion header
    const gc=div(`background:${T.card};border-radius:18px;border:1px solid ${T.border};margin-bottom:10px;overflow:hidden;`);
    const hdr=div(`display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;background:${isExpanded?T.gl:'#fff'};transition:background .2s;`);
    hdr.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;flex:1;">
        <span style="font-size:18px;">${g.icon}</span>
        <div>
          <p style="font-size:14px;font-weight:500;color:${T.text};margin-bottom:2px;">${g.name}</p>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:11px;font-weight:500;background:${sc.bg};color:${sc.color};border-radius:20px;padding:3px 8px;">${sc.emoji} ${sc.label}</span>
            ${st.total>0?`<span style="font-size:11px;color:${T.muted};">${st.rate}% · ${st.total} ${S.lang==='ko'?'번':'tries'}</span>`:''}
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;color:${T.green};font-size:12px;font-weight:500;flex-shrink:0;">
        ${isExpanded
          ? `<span>${S.lang==='ko'?'접기':'See less'}</span><span style="font-size:16px;">−</span>`
          : `<span>${S.lang==='ko'?'더 보기':'See more'}</span><span style="font-size:16px;">+</span>`}
      </div>
    `;
    hdr.onclick = () => {
      S.expandedGoals[i] = !isExpanded;
      render();
    };
    gc.appendChild(hdr);

    // accordion body — only when expanded
    if (isExpanded) {
      const body = div('padding:0 16px 16px;border-top:1px solid #EAE6DE;');

      if(st.total>0){
        const bw=div('margin-bottom:10px;margin-top:12px;');
        const bb=div(`height:6px;border-radius:3px;background:${T.border};overflow:hidden;margin-bottom:5px;`);
        const bf=div(`height:100%;width:${st.rate}%;background:${sc.color};border-radius:3px;`);
        bb.appendChild(bf); bw.appendChild(bb);
        bw.innerHTML+=`<span style="font-size:11px;color:${T.muted}">${S.lang==='ko'?'성공':'Success'} ${st.rate}% · ${S.lang==='ko'?'부분 성공':'Partial'} ${st.partialRate}%</span>`;
        body.appendChild(bw);

        const adv=div(`background:${sc.bg};border-radius:10px;padding:10px 12px;margin-bottom:${st.worked.length||st.next.length?'10px':'0'};`);
        adv.innerHTML=`<p style="font-size:12px;color:${sc.color};line-height:1.55">${sc.tip}</p>`;
        body.appendChild(adv);

        if(st.worked.length){
          const wn=div('margin-bottom:8px;');
          wn.appendChild(p(`font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;`,L('whatWorkedLabel')));
          st.worked.slice(0,2).forEach(note=>{const np=p(`font-size:12px;color:${T.tm};line-height:1.55;padding:5px 0;border-bottom:1px solid ${T.border};`,`✓ ${note}`);wn.appendChild(np);});
          body.appendChild(wn);
        }
        if(st.next.length){
          const nn=div('');
          nn.appendChild(p(`font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;`,L('tryNext')));
          st.next.slice(0,1).forEach(note=>{const np=p(`font-size:12px;color:${T.tm};line-height:1.55;`,`→ ${note}`);nn.appendChild(np);});
          body.appendChild(nn);
        }

        // analysis section
        const analysisId = `analysis_${i}`;
        const analysisWrap = div('margin-top:12px;');
        analysisWrap.id = analysisId;

      // show existing analysis if available
      const existingAnalysis = S.analyses && S.analyses[i];
      if (existingAnalysis) {
        const a = existingAnalysis;
        const box = div(`background:${T.gl};border-radius:14px;padding:16px 18px;border:1px solid ${T.border};margin-bottom:10px;`);
        box.innerHTML = `<p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">${L('nextCycleLabel')}${a.date ? ' · ' + a.date : ''}</p>`;

        if(a.working?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('workingLabel')}</p>`;
          a.working.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✓ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        if(a.not_working?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('notWorkingLabel')}</p>`;
          a.not_working.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✗ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        if(a.next_actions?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.green};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('tryNextCycle')}</p>`;
          a.next_actions.forEach((w,idx) => {
            const row = div('display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #e8f5ec;');
            row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:2px">${idx+1}</div><p style="font-size:12px;color:${T.tm};line-height:1.55">${w}</p>`;
            s.appendChild(row);
          });
          box.appendChild(s);
        }
        if(a.avoid?.length) {
          const s = div(`background:${T.rl};border-radius:10px;padding:10px 12px;`);
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.red};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('avoidLabel')}</p>`;
          a.avoid.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;font-family:'DM Sans',sans-serif;`, `✗ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        analysisWrap.appendChild(box);
      }

      const genBtn = document.createElement('button');
      genBtn.style.cssText = `width:100%;padding:11px;background:linear-gradient(135deg,${T.green},${T.gm});border:none;border-radius:12px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;`;
      genBtn.textContent = L('generateBtn');
      genBtn.onclick = async () => {
        genBtn.textContent = L('analyzing');
        genBtn.disabled = true;
        genBtn.style.opacity = '0.7';

        try {
          const goalLogs = S.logs.filter(l => l.goalIdx === i);
          const response = await fetch(ANALYZE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'analyze',
              user_id: USER_ID,
              child: S.child,
              childAge: S.age,
              goalName: g.name,
              lang: S.lang || 'en',
              logs: goalLogs
            })
          });

          const result = await response.json();

          if (result.status === 'ok' && result.analysis) {
            const a = result.analysis;

            // save analysis to state
            if (!S.analyses) S.analyses = [];
            S.analyses[i] = { ...a, date: new Date().toLocaleDateString(S.lang==='ko'?'ko-KR':'en-US') };

            // update goal actions with next_actions from Claude
            if (a.next_actions && a.next_actions.length > 0) {
              S.goals[i].actions = a.next_actions;
              S.goals[i].avoid = a.avoid ? a.avoid.join(' · ') : S.goals[i].avoid;
              S.goals[i].goal_version = (S.goals[i].goal_version || 1) + 1;
            }
            saveState();
            if (currentUser) await saveToSupabase();

            // show updated toast
            const updateToast = div(`background:${T.gl};border-radius:12px;padding:10px 14px;margin-bottom:10px;`);
            updateToast.innerHTML = `<p style="font-size:13px;color:${T.green};font-weight:500;">${L('cardUpdated')}</p>`;
            analysisWrap.appendChild(updateToast);

            const box = div(`background:${T.gl};border-radius:14px;padding:16px 18px;border:1px solid ${T.border};`);
            box.innerHTML = `<p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">${L('nextCycleLabel')}</p>`;

            if(a.working?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('workingLabel')}</p>`;
              a.working.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✓ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            if(a.not_working?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('notWorkingLabel')}</p>`;
              a.not_working.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✗ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            if(a.next_actions?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.green};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('tryNextCycle')}</p>`;
              a.next_actions.forEach((w,idx) => {
                const row = div('display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #e8f5ec;');
                row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:2px">${idx+1}</div><p style="font-size:12px;color:${T.tm};line-height:1.55">${w}</p>`;
                s.appendChild(row);
              });
              box.appendChild(s);
            }

            if(a.avoid?.length) {
              const s = div(`background:${T.rl};border-radius:10px;padding:10px 12px;`);
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.red};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">Avoid</p>`;
              a.avoid.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;font-family:'DM Sans',sans-serif;`, `✗ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            analysisWrap.appendChild(box);
          } else {
            genBtn.textContent = L('generateBtn');
            genBtn.disabled = false;
            genBtn.style.opacity = '1';
          }

        } catch(err) {
          // CORS issue fallback — show message
          analysisWrap.innerHTML = '';
          const fallback = div(`background:${T.gl};border-radius:12px;padding:14px 16px;`);
          fallback.innerHTML = `<p style="font-size:13px;color:${T.green};font-weight:500;margin-bottom:4px;">✓ Analysis requested!</p><p style="font-size:12px;color:${T.gm};line-height:1.6">Results are being saved to your sheet. Check the Beta_Recommendations tab in your Google Sheet to see the full analysis.</p>`;
          analysisWrap.appendChild(fallback);
        }
      };

        analysisWrap.appendChild(genBtn);
        body.appendChild(analysisWrap);
      }

      const lb=document.createElement('button'); lb.style.cssText=`width:100%;padding:10px;background:none;border:1px solid ${T.border};border-radius:12px;font-size:13px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;`; lb.textContent=L('logToday',g.name); lb.onclick=()=>{S.logGoalIdx=i;S.tempLog={};go('log');};
      body.appendChild(lb);
      gc.appendChild(body);
    } // end expanded

    wrap.appendChild(gc);
  });

  return wrap;
}

// ── REPORT ─────────────────────────────────────────────────────────
function renderReport() {
  const wrap=div('flex:1;overflow-y:auto;padding:24px 22px 40px;');

  // header
  const back=document.createElement('button'); back.style.cssText=`background:none;border:none;cursor:pointer;color:${T.tm};font-size:14px;margin-bottom:20px;padding:0;font-family:'DM Sans',sans-serif;`; back.textContent='← '+(S.lang==='ko'?'뒤로':'Back'); back.onclick=()=>go('week'); wrap.appendChild(back);

  wrap.appendChild(h('h2',"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#1A1A1A;margin-bottom:4px;", S.lang==='ko'?'진행 리포트':'Progress Report'));
  wrap.appendChild(p(`font-size:13px;color:${T.muted};margin-bottom:20px;`, `${S.child} · ${S.lang==='ko'?'작성자':'by'} ${S.parent}`));

  // period selector
  if (!S.reportPeriod) S.reportPeriod = '4w';
  const periodRow = div('display:flex;gap:8px;margin-bottom:20px;');
  const periods = S.lang==='ko'
    ? [['2w','2주'],['4w','4주'],['all','전체']]
    : [['2w','2 weeks'],['4w','4 weeks'],['all','All time']];
  periods.forEach(([val,label])=>{
    const b=document.createElement('button');
    b.style.cssText=`padding:7px 14px;border-radius:20px;border:1.5px solid ${S.reportPeriod===val?T.green:T.border};background:${S.reportPeriod===val?T.gl:'#fff'};color:${S.reportPeriod===val?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;
    b.textContent=label;
    b.onclick=()=>{ S.reportPeriod=val; render(); };
    periodRow.appendChild(b);
  });
  wrap.appendChild(periodRow);

  // filter logs by period
  const now = new Date();
  const cutoff = S.reportPeriod==='2w' ? 14 : S.reportPeriod==='4w' ? 28 : 999;
  const filteredLogs = S.logs.filter(l => {
    if (S.reportPeriod==='all') return true;
    const parts = l.date?.split('/');
    if (!parts || parts.length < 2) return true;
    const logDate = new Date(now.getFullYear(), parseInt(parts[0])-1, parseInt(parts[1]));
    return (now - logDate) / (1000*60*60*24) <= cutoff;
  });

  // overall summary box
  const totalAtt = filteredLogs.filter(l=>l.attempted==='Yes').length;
  const totalSucc = filteredLogs.filter(l=>l.outcome===L('success')||l.outcome==='Success').length;
  const totalPart = filteredLogs.filter(l=>l.outcome===L('partial')||l.outcome==='Partial success').length;
  const overallRate = totalAtt > 0 ? Math.round(totalSucc/totalAtt*100) : 0;

  const summaryBox = div(`background:${T.gl};border-radius:16px;padding:16px 18px;margin-bottom:20px;`);
  summaryBox.innerHTML=`<p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">${S.lang==='ko'?'전체 요약':'Overall Summary'}</p>`;
  const statsRow = div('display:flex;gap:8px;');
  [
    [totalAtt, S.lang==='ko'?'시도 횟수':'Attempts'],
    [overallRate+'%', S.lang==='ko'?'성공률':'Success rate'],
    [S.goals.length, S.lang==='ko'?'목표 개수':'Goals'],
  ].forEach(([val,label])=>{
    const sc=div(`flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;`);
    sc.innerHTML=`<p style="font-family:'Fraunces',serif;font-size:20px;color:${T.text}">${val}</p><p style="font-size:11px;color:${T.muted};margin-top:2px">${label}</p>`;
    statsRow.appendChild(sc);
  });
  summaryBox.appendChild(statsRow);

  // what worked overall
  const allWorked = filteredLogs.filter(l=>l.worked).map(l=>l.worked).filter(Boolean);
  const allNext = filteredLogs.filter(l=>l.next).map(l=>l.next).filter(Boolean);
  if (allWorked.length > 0) {
    const ww = div(`margin-top:12px;padding-top:12px;border-top:1px solid ${T.border};`);
    ww.innerHTML=`<p style="font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${S.lang==='ko'?'효과 있었던 것':'What worked'}</p>`;
    allWorked.slice(0,3).forEach(w=>{
      const row=div('display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;');
      row.innerHTML=`<span style="color:${T.green};font-size:12px;margin-top:1px;">✓</span><p style="font-size:12px;color:${T.tm};line-height:1.5;">${w}</p>`;
      ww.appendChild(row);
    });
    summaryBox.appendChild(ww);

  wrap.appendChild(summaryBox);

  // per goal breakdown
  const goalLabel = div(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;`);

  wrap.appendChild(goalLabel);

  S.goals.forEach((g,i)=>{
    const goalLogs = filteredLogs.filter(l=>l.goalIdx===i);
    const att = goalLogs.filter(l=>l.attempted==='Yes').length;
    const succ = goalLogs.filter(l=>l.outcome===L('success')||l.outcome==='Success').length;
    const part = goalLogs.filter(l=>l.outcome===L('partial')||l.outcome==='Partial success').length;
    const rate = att>0 ? Math.round(succ/att*100) : 0;

    const next = goalLogs.filter(l=>l.next).map(l=>l.next).filter(Boolean);
    const analysis = S.analyses?.[i];

    gc.appendChild(ghdr);

    // progress bar

    const pf = div(`height:100%;border-radius:3px;background:${T.green};width:${rate}%;transition:width .8s;`);
    pb.appendChild(pf); gc.appendChild(pb);

    // stats
    const sr = div('display:flex;gap:8px;margin-bottom:12px;');
    [[att, S.lang==='ko'?'시도':'attempts'],[succ, S.lang==='ko'?'성공':'success'],[part, S.lang==='ko'?'부분 성공':'partial']].forEach(([v,l])=>{
      const sc=div(`flex:1;background:${T.bg};border-radius:10px;padding:8px;text-align:center;`);
      sc.innerHTML=`<p style="font-size:16px;font-weight:500;color:${T.text}">${v}</p><p style="font-size:10px;color:${T.muted};margin-top:2px">${l}</p>`;
      sr.appendChild(sc);
    });
    gc.appendChild(sr);

    // what worked
    if (worked.length > 0) {
      const ww = div(`background:${T.gl};border-radius:10px;padding:10px 12px;margin-bottom:8px;`);
      ww.innerHTML=`<p style="font-size:10px;font-weight:500;color:${T.green};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${S.lang==='ko'?'효과 있었던 것':'What worked'}</p>`;
      worked.slice(0,2).forEach(w=>{
        const row=div('display:flex;gap:6px;margin-bottom:3px;');
        row.innerHTML=`<span style="color:${T.green};font-size:11px;">✓</span><p style="font-size:12px;color:${T.tm};line-height:1.5;">${w}</p>`;
        ww.appendChild(row);
      });
      gc.appendChild(ww);
    }

    // what didn't work
    if (notWorked.length > 0) {
      const nw = div(`background:${T.rl};border-radius:10px;padding:10px 12px;margin-bottom:8px;`);
      nw.innerHTML=`<p style="font-size:10px;font-weight:500;color:${T.red};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${S.lang==='ko'?'효과 없었던 것':'What didn\'t work'}</p>`;
      notWorked.slice(0,2).forEach(w=>{
        const row=div('display:flex;gap:6px;margin-bottom:3px;');
        row.innerHTML=`<span style="color:${T.red};font-size:11px;">✗</span><p style="font-size:12px;color:${T.tm};line-height:1.5;">${w}</p>`;
        nw.appendChild(row);
      });
      gc.appendChild(nw);
    }

    // latest recommendations
    if (analysis?.next_actions?.length) {
      const rec = div(`background:${T.ol};border-radius:10px;padding:10px 12px;margin-bottom:8px;`);
      rec.innerHTML=`<p style="font-size:10px;font-weight:500;color:${T.orange};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${S.lang==='ko'?'최근 추천':'Latest recommendations'}</p>`;
      analysis.next_actions.slice(0,3).forEach((a,ai)=>{
        const row=div('display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;');
        row.innerHTML=`<div style="width:16px;height:16px;min-width:16px;border-radius:50%;background:${T.orange};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;margin-top:1px">${ai+1}</div><p style="font-size:12px;color:${T.tm};line-height:1.5;">${a}</p>`;
        rec.appendChild(row);
      });
      gc.appendChild(rec);
    }

    if (att === 0) {
      gc.appendChild(p(`font-size:13px;color:${T.muted};font-style:italic;`, S.lang==='ko'?'이 기간에 기록이 없어요.':'No logs for this period.'));
    }

    wrap.appendChild(gc);
  });

  // print button
  const printBtn = document.createElement('button');
  printBtn.style.cssText=`width:100%;padding:14px;background:#fff;color:${T.green};border:1.5px solid ${T.green};border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;`;
  printBtn.innerHTML=`🖨️ ${S.lang==='ko'?'인쇄 / PDF 저장':'Print / Save as PDF'}`;
  printBtn.onclick=()=>window.print();
  wrap.appendChild(printBtn);

  // send email section
  const emailSection = div(`margin-top:12px;background:#fff;border-radius:16px;border:1px solid ${T.border};padding:16px 18px;`);
  emailSection.innerHTML=`<p style="font-size:13px;font-weight:500;color:${T.tm};margin-bottom:4px;">📧 ${S.lang==='ko'?'이메일로 공유하기':'Share via email'}</p><p style="font-size:12px;color:${T.muted};margin-bottom:12px;">${S.lang==='ko'?'리포트를 이메일로 전송해요.':'Report will be shared via email.'}</p>`;

  const emailInp = document.createElement('input');
  emailInp.type='email';
  emailInp.placeholder=S.lang==='ko'?'받는 사람 이메일 주소':'Recipient email address';
  emailInp.style.cssText=`width:100%;padding:11px 14px;border:1.5px solid ${T.border};border-radius:12px;font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:10px;outline:none;`;
  emailSection.appendChild(emailInp);

  const sendMsg = p(`font-size:12px;color:${T.gm};margin-top:8px;display:none;`,'');
  const sendBtn = document.createElement('button');
  sendBtn.style.cssText=`width:100%;padding:12px;background:${T.green};color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;`;
  sendBtn.textContent=S.lang==='ko'?'이메일 전송하기 →':'Send report →';

  sendBtn.onclick = async () => {
    const to = emailInp.value.trim();
    if (!to) return;
    sendBtn.textContent = S.lang==='ko'?'전송 중...':'Sending...';
    sendBtn.disabled = true;

    // build report HTML
    const period = S.reportPeriod==='2w'?(S.lang==='ko'?'최근 2주':'Last 2 weeks'):S.reportPeriod==='4w'?(S.lang==='ko'?'최근 4주':'Last 4 weeks'):(S.lang==='ko'?'전체':'All time');
    const now2 = new Date();
    const cutoff2 = S.reportPeriod==='2w'?14:S.reportPeriod==='4w'?28:999;
    const fLogs = S.logs.filter(l=>{
      if(S.reportPeriod==='all') return true;
      const parts=l.date?.split('/');
      if(!parts||parts.length<2) return true;
      const ld=new Date(now2.getFullYear(),parseInt(parts[0])-1,parseInt(parts[1]));
      return (now2-ld)/(1000*60*60*24)<=cutoff2;
    });

    const tAtt=fLogs.filter(l=>l.attempted==='Yes').length;
    const tSucc=fLogs.filter(l=>l.outcome===L('success')||l.outcome==='Success').length;
    const oRate=tAtt>0?Math.round(tSucc/tAtt*100):0;

    let goalsHtml = '';
    S.goals.forEach((g,i)=>{
      const gl=fLogs.filter(l=>l.goalIdx===i);
      const ga=gl.filter(l=>l.attempted==='Yes').length;
      const gs=gl.filter(l=>l.outcome===L('success')||l.outcome==='Success').length;
      const gr=ga>0?Math.round(gs/ga*100):0;
      const gw=gl.filter(l=>l.worked).map(l=>l.worked).filter(Boolean);
      const gn=gl.filter(l=>l.didnt_work).map(l=>l.didnt_work).filter(Boolean);
      const an=S.analyses?.[i];
      goalsHtml += `
        <div style="background:#fff;border:1px solid #EAE6DE;border-radius:12px;padding:16px;margin-bottom:12px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:8px;"><tr>
          <td style="font-size:14px;font-weight:500;color:#1A1A1A;">${g.icon} ${g.name}</td>
          <td align="right" style="font-size:12px;font-weight:500;color:${gr>=50?'#2D5A3D':'#D4622A'};white-space:nowrap;">${gr}% success</td>
        </tr></table>
          <div style="height:4px;background:#EAE6DE;border-radius:2px;margin-bottom:10px;">
            <div style="height:100%;width:${gr}%;background:#2D5A3D;border-radius:2px;"></div>
          </div>
          <p style="font-size:12px;color:#909090;margin-bottom:8px;">${ga} attempts · ${gs} success</p>
          ${gw.length?`<p style="font-size:12px;color:#2D5A3D;margin-bottom:4px;"><strong>✓ What worked:</strong> ${gw.slice(0,2).join(' / ')}</p>`:''}
          ${gn.length?`<p style="font-size:12px;color:#C84B3A;margin-bottom:4px;"><strong>✗ What didn't work:</strong> ${gn.slice(0,2).join(' / ')}</p>`:''}
          ${an?.next_actions?.length?`<p style="font-size:12px;color:#D4622A;"><strong>→ Recommendations:</strong> ${an.next_actions.slice(0,2).join(' / ')}</p>`:''}
        </div>`;
    });

    const emailBody = `
      <div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:24px;background:#F8F6F2;">
        <h1 style="font-size:22px;color:#2D5A3D;margin-bottom:4px;">🌿 Therapy Buddy</h1>
        <h2 style="font-size:20px;font-weight:400;color:#1A1A1A;margin-bottom:4px;">Progress Report — ${S.child}</h2>
        <p style="font-size:13px;color:#909090;margin-bottom:20px;">Period: ${period} · Prepared by ${S.parent}</p>

        <div style="background:#EAF2EC;border-radius:12px;padding:16px;margin-bottom:20px;">
          <p style="font-size:11px;font-weight:bold;color:#2D5A3D;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">Overall Summary</p>
          <div style="display:flex;gap:12px;">
            <div style="flex:1;background:#fff;border-radius:8px;padding:10px;text-align:center;">
              <p style="font-size:20px;font-weight:500;color:#1A1A1A;">${tAtt}</p>
              <p style="font-size:11px;color:#909090;">Attempts</p>
            </div>
            <div style="flex:1;background:#fff;border-radius:8px;padding:10px;text-align:center;">
              <p style="font-size:20px;font-weight:500;color:#1A1A1A;">${oRate}%</p>
              <p style="font-size:11px;color:#909090;">Success rate</p>
            </div>
            <div style="flex:1;background:#fff;border-radius:8px;padding:10px;text-align:center;">
              <p style="font-size:20px;font-weight:500;color:#1A1A1A;">${S.goals.length}</p>
              <p style="font-size:11px;color:#909090;">Goals</p>
            </div>
          </div>
        </div>

        <p style="font-size:11px;font-weight:bold;color:#909090;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">By Goal</p>
        ${goalsHtml}

        <p style="font-size:12px;color:#909090;margin-top:20px;text-align:center;">Sent via Therapy Buddy · therapybuddy.org</p>
      </div>`;

    try {
      await fetch('/.netlify/functions/email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to,
          replyTo: S.parent,
          subject: `Therapy Buddy Progress Report — ${S.child} (${period})`,
          body: emailBody
        })
      });
      sendBtn.textContent = S.lang==='ko'?'✓ 전송됐어요':'✓ Sent!';
      sendBtn.style.background = '#4A8C60';
      sendMsg.textContent = S.lang==='ko'?'이메일이 전송됐어요!':'Report sent!';
      sendMsg.style.color = '#2D5A3D';
    } catch(e) {
      sendMsg.textContent = S.lang==='ko'?'✗ 오류가 발생했어요. 다시 시도해주세요.':'✗ Something went wrong. Try again.';
      sendMsg.style.color = '#C84B3A';
      sendBtn.textContent = S.lang==='ko'?'이메일 전송하기 →':'Send report →';
      sendBtn.disabled = false;
    }
    sendMsg.style.display = 'block';
  };

  emailSection.appendChild(sendBtn);
  emailSection.appendChild(sendMsg);
  wrap.appendChild(emailSection);

  return wrap;
}

// ── GOALS ──────────────────────────────────────────────────────────
function renderGoals() {
  const wrap=div('flex:1;overflow-y:auto;padding:24px 22px 32px;');
  wrap.appendChild(h('h2',"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#1A1A1A;margin-bottom:6px;",L('goalsTitle')));
  wrap.appendChild(p(`font-size:14px;color:${T.muted};margin-bottom:24px;line-height:1.55;`, L('goalsSub', S.child)));

  S.goals.forEach((g,i)=>{
    const st=stats(i); const sc=statusCfg(st.status);
    const row=div(`background:${T.card};border-radius:18px;border:1px solid ${T.border};padding:16px 18px;margin-bottom:10px;`);
    const top=div('display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;');
