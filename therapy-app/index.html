<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* Force DM Sans for all non-Fraunces elements to prevent Korean text rendering issues */
*:not([style*="Fraunces"]) { font-family: inherit; }
.card-avoid, .card-avoid * { font-family: 'DM Sans', sans-serif !important; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #1a1a1a;
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0;
}
.phone {
  width: 100%;
  max-width: 390px;
  height: 100dvh;
  background: #F8F6F2;
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 40px 120px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  position: relative;
}
.status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #F8F6F2; flex-shrink: 0; }
.status span { font-size: 13px; font-weight: 500; color: #555; }
.screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; min-height: 0; }
.screen::-webkit-scrollbar { display: none; }
.nav { height: 80px; background: #fff; border-top: 1px solid #EAE6DE; display: flex; align-items: center; justify-content: space-around; padding: 0 8px 14px; flex-shrink: 0; position: relative; z-index: 10; }
.nav-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: 'DM Sans', sans-serif; font-size: 10px; color: #aaa; padding: 4px 12px; transition: color 0.2s; }
.nav-btn.active { color: #2D5A3D; font-weight: 500; }
.nav-dot { width: 4px; height: 4px; border-radius: 2px; background: #2D5A3D; }

/* tokens */
:root {
  --green: #2D5A3D; --gl: #EAF2EC; --gm: #4A8C60;
  --text: #1A1A1A; --tm: #4A4A4A; --muted: #909090;
  --border: #EAE6DE; --card: #fff; --bg: #F8F6F2;
  --red: #C84B3A; --rl: #FDECEA;
  --orange: #D4622A; --ol: #FDF0EA;
}

/* shared */
.serif { font-family: 'Fraunces', serif; font-weight: 400; }
.pad { padding: 24px 22px; }
.label { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px; }
.card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 10px; }

/* inputs */
input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%; padding: 13px 15px; font-size: 14px;
  border: 1.5px solid var(--border); border-radius: 13px;
  background: #fff; outline: none; font-family: 'DM Sans', sans-serif;
  color: var(--text); transition: border-color .2s; margin-bottom: 10px;
}
input:focus, textarea:focus, select:focus { border-color: var(--green); }
textarea { resize: none; height: 60px; line-height: 1.5; }

/* buttons */
.btn { width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:disabled { background: var(--border); color: var(--muted); cursor: default; }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--tm); }

/* progress dots */
.dots { display: flex; gap: 5px; margin-bottom: 32px; }
.dot { height: 4px; border-radius: 2px; flex: 1; background: var(--border); transition: all .3s; }
.dot.on { background: var(--green); flex: 2; }

/* radio chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; color: var(--tm); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .15s; }
.chip.on { border-color: var(--green); background: var(--gl); color: var(--green); font-weight: 500; }

/* goal cards */
.goal-card { border-radius: 22px; padding: 20px 22px; margin-bottom: 12px; cursor: pointer; position: relative; overflow: hidden; }
.goal-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.06); }

/* stat cards */
.stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
.stat { flex: 1; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 12px; text-align: center; }
.stat-val { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text); }
.stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* week goal card */
.wk-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 12px; }
.progress-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin: 8px 0 5px; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }

/* toast */
.toast { background: var(--gl); border-radius: 13px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.toast p { font-size: 13px; color: var(--green); font-weight: 500; }
</style>

<script>
const T = { green:'#2D5A3D',gl:'#EAF2EC',gm:'#4A8C60',text:'#1A1A1A',tm:'#4A4A4A',muted:'#909090',border:'#EAE6DE',card:'#fff',bg:'#F8F6F2',red:'#C84B3A',rl:'#FDECEA',orange:'#D4622A',ol:'#FDF0EA' };
const CARD_COLORS = ['#2D5A3D','#1a6b8a','#7a4a2d','#5a3a7a','#3a6a4a'];
const STORAGE_KEY = 'therapy_buddy_v1';

// ── SUPABASE ─────────────────────────────────────────────────────────
let supabase = null;
let currentUser = null;

async function initSupabase() {
  try {
    const res = await fetch('/.netlify/functions/config');
    if (!res.ok) throw new Error('Config fetch failed');
    const { supabaseUrl, supabaseKey } = await res.json();

    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(supabaseUrl, supabaseKey, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true,
        storage: window.localStorage,
        storageKey: 'tb_supabase_auth',
      }
    });

    // BroadcastChannel — if this is the new tab from magic link
    const authChannel = new BroadcastChannel('tb_auth');

    // check if this tab has a token (magic link tab)
    const hasToken = window.location.hash.includes('access_token') ||
                     window.location.search.includes('code=') ||
                     window.location.search.includes('token=');

    if (hasToken) {
      document.body.innerHTML = `
        <div style="font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F8F6F2;gap:16px;">
          <div style="font-size:40px;">🌿</div>
          <p style="font-size:18px;color:#2D5A3D;font-weight:500;">Signed in successfully!</p>
          <p style="font-size:14px;color:#909090;">Go back to your previous tab to continue.</p>
          <a href="https://therapybuddy.org" style="margin-top:8px;padding:12px 24px;background:#2D5A3D;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;">Go to Therapy Buddy →</a>
        </div>`;
      setTimeout(async () => {
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          authChannel.postMessage({ type: 'SIGNED_IN', session: data.session });
        }
      }, 1000);
      return;
    }

    // original tab — listen for auth from magic link tab
    authChannel.onmessage = async (event) => {
      if (event.data.type === 'SIGNED_IN') {
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          currentUser = data.session.user;
          await loadFromSupabase();
          render();
        }
      }
    };

    // check existing session
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      await loadFromSupabase();
    }

    // listen for auth changes
    supabase.auth.onAuthStateChange(async (event, session) => {
      console.log('Auth event:', event, session?.user?.email);
      if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const localData = JSON.parse(saved);
          S.parent = localData.parent || S.parent;
          S.child = localData.child || S.child;
          S.age = localData.age || S.age;
          S.goals = localData.goals?.length ? localData.goals : S.goals;
          S.logs = localData.logs?.length ? localData.logs : S.logs;
          S.analyses = localData.analyses || S.analyses;
          S.lang = localData.lang || S.lang;
        }
        await loadFromSupabase();
        render();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        render();
      }
    });

  } catch(e) {
    console.log('Supabase init failed:', e);
  }
}

async function initSupabaseAndRender() {
  await initSupabase();
  render();
}

async function signInWithGoogle() {
  if (!supabase) return;
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://therapybuddy.org/auth/callback'
    }
  });
  if (error) console.log('Google sign in error:', error);
}

async function signInWithMagicLink(email) {
  if (!supabase) return { error: 'Not initialized' };
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: 'https://therapybuddy.org/auth/callback',
      shouldCreateUser: true,
    }
  });
  return { error };
}

async function signOut() {
  if (!supabase) return;
  await supabase.auth.signOut();
  currentUser = null;
  render();
}

async function saveToSupabase() {
  if (!supabase || !currentUser) {
    console.log('saveToSupabase: no supabase or user', supabase, currentUser);
    return;
  }
  try {
    console.log('Saving to Supabase, user:', currentUser.id);
    // upsert profile
    const { error: profileError } = await supabase.from('profiles').upsert({
      id: currentUser.id,
      parent_name: S.parent,
      child_name: S.child,
      child_age: S.age,
      lang: S.lang
    });
    if (profileError) console.log('Profile error:', profileError);
    else console.log('Profile saved!');

    // upsert goals
    for (const g of S.goals) {
      const { error: goalError } = await supabase.from('goals').upsert({
        id: g.goal_id,
        user_id: currentUser.id,
        goal_number: g.goal_number,
        icon: g.icon,
        name: g.name,
        trigger: g.trigger,
        actions: g.actions,
        avoid: g.avoid,
        goal_version: g.goal_version
      });
      if (goalError) console.log('Goal error:', goalError);
      else console.log('Goal saved:', g.name);
    }

    // save analyses
    for (let i = 0; i < S.goals.length; i++) {
      const a = S.analyses?.[i];
      if (!a) continue;
      const { error: analysisError } = await supabase.from('analyses').upsert({
        user_id: currentUser.id,
        goal_id: S.goals[i].goal_id,
        working: a.working || [],
        not_working: a.not_working || [],
        next_actions: a.next_actions || [],
        avoid: a.avoid || []
      });
      if (analysisError) console.log('Analysis error:', analysisError);
    }
  } catch(e) {
    console.log('Supabase save failed:', e);
  }
}

async function saveLogToSupabase(log, goalId) {
  if (!supabase || !currentUser) return;
  try {
    await supabase.from('logs').insert({
      user_id: currentUser.id,
      goal_id: goalId,
      goal_name: log.goalName,
      date: log.date,
      caregiver: log.caregiver,
      before_state: log.before,
      attempted: log.attempted,
      technique: log.technique,
      worked: log.worked,
      didnt_work: log.didnt_work,
      reaction: log.reaction,
      outcome: log.outcome,
      next: log.next
    });
  } catch(e) {
    console.log('Log save failed:', e);
  }
}

async function loadFromSupabase() {
  if (!supabase || !currentUser) return;
  try {
    const { data: profile } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    if (profile && profile.parent_name) {
      // existing Supabase user
      S.parent = profile.parent_name || '';
      S.child = profile.child_name || '';
      S.age = profile.child_age || '';
      S.lang = profile.lang || 'en';

      const { data: goals } = await supabase
        .from('goals').select('*')
        .eq('user_id', currentUser.id)
        .order('goal_number');

      if (goals && goals.length > 0) {
        S.goals = goals.map(g => ({
          goal_id: g.id,
          goal_number: g.goal_number,
          goal_version: g.goal_version,
          icon: g.icon,
          name: g.name,
          trigger: g.trigger,
          actions: g.actions || [],
          avoid: g.avoid
        }));
      }

      const { data: logs } = await supabase
        .from('logs').select('*')
        .eq('user_id', currentUser.id)
        .order('created_at');

      if (logs) {
        S.logs = logs.map(l => ({
          goalIdx: S.goals.findIndex(g => g.goal_id === l.goal_id),
          date: l.date,
          caregiver: l.caregiver,
          before: l.before_state,
          attempted: l.attempted,
          technique: l.technique,
          worked: l.worked,
          didnt_work: l.didnt_work,
          reaction: l.reaction,
          outcome: l.outcome,
          next: l.next
        }));
      }

      const { data: analyses } = await supabase
        .from('analyses').select('*')
        .eq('user_id', currentUser.id);

      if (analyses) {
        S.analyses = [];
        analyses.forEach(a => {
          const idx = S.goals.findIndex(g => g.goal_id === a.goal_id);
          if (idx >= 0) S.analyses[idx] = {
            working: a.working,
            not_working: a.not_working,
            next_actions: a.next_actions,
            avoid: a.avoid,
            date: new Date(a.created_at).toLocaleDateString(S.lang==='ko'?'ko-KR':'en-US')
          };
        });
      }

      S.view = 'home';

    } else {
      // no Supabase profile — check localStorage
      const saved = localStorage.getItem(STORAGE_KEY);
      const localData = saved ? JSON.parse(saved) : null;

      if (localData && localData.parent) {
        // migrate localStorage to Supabase
        S.parent = localData.parent;
        S.child = localData.child;
        S.age = localData.age;
        S.goals = localData.goals || [];
        S.logs = localData.logs || [];
        S.analyses = localData.analyses || [];
        S.lang = localData.lang || 'en';
        S.view = 'home';
        await saveToSupabase();
        console.log('Migrated localStorage to Supabase');
      } else if (S.parent) {
        // S already has data (set during this session)
        S.view = 'home';
        await saveToSupabase();
      }
    }
  } catch(e) {
    console.log('Supabase load failed:', e);
    // fallback — if S already has data, go to home
    if (S.parent) S.view = 'home';
  }
}

}

// ── RESTORE CODE ────────────────────────────────────────────────────
// 6-char alphanumeric code derived from user ID — easy to write down
function getRestoreCode() {
  const uid = USER_ID;
  let code = '';
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let i = 0; i < 6; i++) {
    code += chars[uid.charCodeAt(i % uid.length) % chars.length];
  }
  return code;
}

const RESTORE_CODE = getRestoreCode();

// Store full state under restore code key so it can be found later
function saveWithRestoreCode() {
  try {
    const toSave = { parent:S.parent, child:S.child, age:S.age, goals:S.goals, logs:S.logs, view:S.view, uid: USER_ID };
    localStorage.setItem('tb_restore_' + RESTORE_CODE, JSON.stringify(toSave));
  } catch(e) {}
}

async function restoreFromCode(code) {
  try {
    const key = 'tb_restore_' + code.toUpperCase().trim();
    // try localStorage first
    const saved = localStorage.getItem(key);
    if (saved) {
      const data = JSON.parse(saved);
      S.parent = data.parent || '';
      S.child = data.child || '';
      S.age = data.age || '';
      S.goals = data.goals || [];
      S.logs = data.logs || [];
      S.analyses = data.analyses || [];
      S.lang = data.lang || 'en';
      S.view = 'home';
      if (data.uid) localStorage.setItem('therapy_buddy_uid', data.uid);
      saveState();
      return true;
    }
    // fallback — fetch from Google Sheets
    const res = await fetch(WEBHOOK_URL + '?type=restore&code=' + code.toUpperCase().trim());
    if (res.ok) {
      const data = await res.json();
      if (data && data.parent) {
        S.parent = data.parent || '';
        S.child = data.child || '';
        S.age = data.age || '';
        S.goals = data.goals || [];
        S.logs = data.logs || [];
        S.analyses = data.analyses || [];
        S.lang = data.lang || 'en';
        S.view = 'home';
        saveState();
        return true;
      }
    }
    return false;
  } catch(e) { return false; }
}

function saveState() {
  try {
    const toSave = { parent:S.parent, child:S.child, age:S.age, goals:S.goals, logs:S.logs, view:S.view, analyses:S.analyses, isDemo:S.isDemo, lang:S.lang };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    localStorage.setItem('tb_lang', S.lang);
    saveWithRestoreCode();
    if (currentUser) saveToSupabase();
  } catch(e) { console.log('Save failed:', e); }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return null;
    return JSON.parse(saved);
  } catch(e) { return null; }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ── STATS ──────────────────────────────────────────────────────────
function stats(idx) {
  const logs = S.logs.filter(l => l.goalIdx === idx && l.attempted === 'Yes');
  const total = logs.length;
  if (!total) return { total:0, rate:0, partialRate:0, posRate:0, status:'none', worked:[], next:[] };
  const succ = logs.filter(l => l.outcome === 'Success').length;
  const part = logs.filter(l => l.outcome === 'Partial success').length;
  const pos = logs.filter(l => l.reaction === 'Positive').length;
  const rate = Math.round(succ/total*100);
  const partialRate = Math.round(part/total*100);
  const posRate = Math.round(pos/total*100);
  const status = rate >= 50 ? 'high' : (rate >= 25 || (rate+partialRate) >= 50) ? 'mid' : 'low';
  return { total, rate, partialRate, posRate, status, worked: logs.filter(l=>l.worked).map(l=>l.worked), next: logs.filter(l=>l.next).map(l=>l.next) };
}

function statusCfg(s) {
  if (s==='high') return { color:T.green, bg:T.gl, label:L('workingWell'), emoji:'↑', tip:L('workingWellTip') };
  if (s==='mid') return { color:T.orange, bg:T.ol, label:L('someProgress'), emoji:'→', tip:L('someProgressTip') };
  if (s==='low') return { color:T.red, bg:T.rl, label:L('notWorking'), emoji:'↓', tip:L('notWorkingTip') };
  return { color:T.muted, bg:T.border, label:'No data yet', emoji:'–', tip:'Log results to see patterns here.' };
}

    if(!S.parent.trim()) btn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
    btn.onclick=()=>{if(S.parent.trim()){saveState();S.step=2;render();}};
    wrap.appendChild(btn);
    setTimeout(()=>inp.focus(),50);
  }

  if (step===2) {
    wrap.appendChild(h('h1',"font-family:'Fraunces',serif;font-size:28px;font-weight:400;color:#1A1A1A;margin-bottom:6px;", L('aboutChild')));
    wrap.appendChild(p(`font-size:14px;color:${T.muted};margin-bottom:24px;`, L('aboutChildSub')));
    const n=document.createElement('input'); n.type='text'; n.value=S.child; n.placeholder=L('childName'); n.oninput=e=>{S.child=e.target.value;updateBtn();};
    const a=document.createElement('input'); a.type='number'; a.value=S.age; a.placeholder=L('childAge'); a.oninput=e=>{S.age=e.target.value;updateBtn();};
    wrap.appendChild(n); wrap.appendChild(a); wrap.appendChild(spacer);
    const btn=document.createElement('button'); btn.id='cont-btn'; btn.className='btn btn-primary'; btn.disabled=!(S.child.trim()&&S.age); btn.textContent=L('continue');
    if(!(S.child.trim()&&S.age)) btn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
    btn.onclick=()=>{if(S.child.trim()&&S.age){saveState();S.step=3;render();}};
    wrap.appendChild(btn);
  }

  if (step===3) {
    wrap.appendChild(h('h1',"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#1A1A1A;margin-bottom:6px;line-height:1.3;", L('therapyGoals', S.child)));
    wrap.appendChild(p(`font-size:14px;color:${T.muted};margin-bottom:20px;line-height:1.55;`, L('therapyGoalsSub')));

    S.goals.forEach((g,i)=>{
      const row=div(`display:flex;align-items:center;gap:10px;background:${T.gl};border-radius:12px;padding:12px 14px;margin-bottom:8px;`);
      row.innerHTML=`<span style="font-size:20px">${g.icon}</span><div style="flex:1"><p style="font-size:13px;font-weight:500;color:${T.green}">${g.name}</p>${g.trigger?`<p style="font-size:11px;color:${T.gm};margin-top:2px">📍 Trigger set</p>`:''}</div>`;
      const eb=document.createElement('button'); eb.textContent=L('editGoal'); eb.style.cssText=`background:none;border:1px solid ${T.gm};border-radius:8px;padding:4px 10px;font-size:11px;color:${T.green};cursor:pointer;font-family:'DM Sans',sans-serif;`;
      eb.onclick=()=>{S.editIdx=i;S.step=3.5;render();};
      const db=document.createElement('button'); db.textContent='✕'; db.style.cssText='background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;padding:0 4px;';
      db.onclick=()=>{S.goals.splice(i,1);render();};
      row.appendChild(eb); row.appendChild(db); wrap.appendChild(row);
    });

    if(S.goals.length<5){
      const ab=document.createElement('button');
      ab.style.cssText=`width:100%;padding:13px;background:none;border:1.5px dashed ${T.border};border-radius:14px;font-size:14px;color:${T.muted};cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:14px;`;
      ab.textContent=L('addGoal');
      ab.onclick=()=>{
        const newGoalId = 'g_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
        S.goals.push({goal_id:newGoalId, goal_version:1, goal_number:S.goals.length+1, icon:'🎯',name:'',trigger:'',actions:[''],avoid:''});
        S.editIdx=S.goals.length-1;S.step=3.5;render();
      };
      wrap.appendChild(ab);
    }

    wrap.appendChild(spacer);
    const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.disabled=S.goals.length===0; btn.textContent=L('letsGo');
    if(S.goals.length===0) btn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
    btn.onclick=()=>{if(S.goals.length>0){ saveState(); if(!currentUser){ S.step=3.8; render(); } else { go('home'); } }};
    wrap.appendChild(btn);
  }

  if (step===3.5) {
    const idx=S.editIdx; const g=S.goals[idx];
    const icons=['🎯','💬','👋','🤝','⭐','🌟','🧩','📚','🎮','🌊','🔔','🏃'];
    const back=document.createElement('button'); back.style.cssText=`background:none;border:none;cursor:pointer;color:${T.tm};font-size:14px;margin-bottom:16px;padding:0;font-family:'DM Sans',sans-serif;`; back.textContent=L('backToGoals'); back.onclick=()=>{S.step=3;render();};
    wrap.appendChild(back);
    wrap.appendChild(h('h1',"font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:#1A1A1A;margin-bottom:6px;", g.name ? `${L('editGoal')}: ${g.name}` : L('setupGoal')));
    wrap.appendChild(p(`font-size:13px;color:${T.muted};margin-bottom:18px;`, S.lang==='ko' ? '이 목표가 액션 카드가 됩니다.' : 'This becomes your action card.'));

    const ir=div('display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;');
    icons.forEach(ic=>{const b=document.createElement('button');b.textContent=ic;b.style.cssText=`width:36px;height:36px;border-radius:10px;border:1.5px solid ${g.icon===ic?T.green:T.border};background:${g.icon===ic?T.gl:'#fff'};font-size:17px;cursor:pointer;`;b.onclick=()=>{g.icon=ic;render();};ir.appendChild(b);});
    wrap.appendChild(ir);

    const lbl=(t)=>{const e=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,t);return e;};

    wrap.appendChild(lbl(L('goalName')));
    const ni=document.createElement('input'); ni.type='text'; ni.value=g.name; ni.placeholder=S.lang==='ko'?'예: 장난감 공유하기':'e.g. Sharing toys with siblings'; ni.oninput=e=>{g.name=e.target.value;updateBtn()};
    wrap.appendChild(ni);

    wrap.appendChild(lbl(L('whenToUse')));
    const ti=document.createElement('input'); ti.type='text'; ti.value=g.trigger; ti.placeholder=L('whenToUsePlaceholder'); ti.oninput=e=>{g.trigger=e.target.value;};
    wrap.appendChild(ti);

    const stepsHeader = div('display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;');
    stepsHeader.appendChild(lbl(L('steps')));
    const optNote = p(`font-size:11px;color:${T.muted};font-style:italic;`, L('stepsOptional'));
    stepsHeader.appendChild(optNote);
    wrap.appendChild(stepsHeader);
    const aw=div();
    const renderActs=()=>{
      aw.innerHTML='';
      g.actions.forEach((a,ai)=>{
        const row=div('display:flex;gap:8px;align-items:center;margin-bottom:8px;');
        const num=div(`width:22px;height:22px;min-width:22px;border-radius:50%;background:${T.gl};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:${T.green};`,(ai+1).toString());
        const ai2=document.createElement('input'); ai2.type='text'; ai2.value=a; ai2.placeholder=S.lang==='ko'?`예: 먼저 아이 상태 확인하기`:`e.g. Check child's state first`; ai2.style.cssText=`flex:1;padding:10px 12px;font-size:13px;border:1.5px solid ${a?T.green:T.border};border-radius:10px;background:#fff;outline:none;font-family:'DM Sans',sans-serif;color:${T.text};`; ai2.oninput=e=>{g.actions[ai]=e.target.value;ai2.style.borderColor=e.target.value?T.green:T.border;};
        row.appendChild(num); row.appendChild(ai2);
        if(g.actions.length>1){const del=document.createElement('button');del.textContent='✕';del.style.cssText='background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;padding:0 4px;';del.onclick=()=>{g.actions.splice(ai,1);renderActs();};row.appendChild(del);}
        aw.appendChild(row);
      });
    };
    renderActs(); wrap.appendChild(aw);
    if(g.actions.length<4){const add=document.createElement('button');add.style.cssText=`background:none;border:none;font-size:13px;color:${T.gm};cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:12px;padding:0;`;add.textContent=L('addStep');add.onclick=()=>{g.actions.push('');renderActs();};wrap.appendChild(add);}

    wrap.appendChild(lbl(L('whatToAvoid')));
    const av=document.createElement('input'); av.type='text'; av.value=g.avoid; av.placeholder=L('avoidPlaceholder'); av.oninput=e=>{g.avoid=e.target.value;};
    wrap.appendChild(av);

    const btn=document.createElement('button'); btn.id='cont-btn'; btn.className='btn btn-primary'; btn.disabled=!g.name.trim(); btn.textContent=L('saveGoal');
    if(!g.name.trim()) btn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
    btn.onclick=()=>{
      if(g.name.trim()){
        if(g.goal_id && g._saved) {
          // existing saved goal — bump version
          g.goal_version = (g.goal_version || 1) + 1;
        } else {
          // new goal — set version to 1
          g.goal_id = g.goal_id || 'g_' + Math.random().toString(36).substr(2,9) + '_' + Date.now();
          g.goal_version = 1;
          g.goal_number = g.goal_number || (S.editIdx + 1);
          g._saved = true;
        }
        saveState();
        S.step=3;
        render();
      }
    };
    wrap.appendChild(btn);
  }

  // ── STEP 3.8 — Account creation ──────────────────────────────────
  if (step === 3.8) {
    const blob = div(`width:60px;height:60px;border-radius:62% 38% 70% 30%/45% 65% 35% 55%;background:linear-gradient(140deg,${T.gm},${T.green});display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:20px;`);
    blob.textContent = '🌿';
    wrap.appendChild(blob);

    wrap.appendChild(h('h1',"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#1A1A1A;line-height:1.3;margin-bottom:8px;", S.lang==='ko' ? '목표가 저장됐어요!' : 'Your goals are saved!'));
    wrap.appendChild(p(`font-size:14px;color:${T.tm};line-height:1.7;margin-bottom:20px;`, S.lang==='ko' ? '계정을 만들면 어느 기기에서나 데이터에 접근할 수 있어요.' : 'Create a free account to access your data from any device.'));

    // benefits
    const benefits = div(`background:${T.gl};border-radius:14px;padding:14px 16px;margin-bottom:20px;`);
    const benefitList = S.lang==='ko'
      ? ['어느 기기에서나 데이터 접근', '데이터를 잃어버리지 않아요', '나중에 보호자 및 치료사와 공유 가능']
      : ['Access your data from any device', 'Never lose your progress', 'Share with caregivers and providers later'];
    benefitList.forEach(b => {
      const row = div('display:flex;gap:8px;align-items:center;margin-bottom:6px;');
      row.innerHTML = `<span style="color:${T.green};font-size:14px;">✓</span><p style="font-size:13px;color:${T.tm};">${b}</p>`;
      benefits.appendChild(row);
    });
    wrap.appendChild(benefits);

    // Google sign in button
    const googleBtn = document.createElement('button');
    googleBtn.style.cssText=`width:100%;padding:12px;background:#fff;color:#1A1A1A;border:1.5px solid ${T.border};border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;`;
    googleBtn.innerHTML=`<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A353" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>${S.lang==='ko'?'Google 로 계속하기':'Continue with Google'}`;
    googleBtn.onclick = signInWithGoogle;
    wrap.appendChild(googleBtn);

    // divider
    const orDiv = div('display:flex;align-items:center;gap:10px;margin-bottom:10px;');
    orDiv.innerHTML=`<div style="flex:1;height:1px;background:${T.border}"></div><p style="font-size:12px;color:${T.muted}">or</p><div style="flex:1;height:1px;background:${T.border}"></div>`;
    wrap.appendChild(orDiv);

    // email input
    const emailInp = document.createElement('input');
    emailInp.type = 'email'; emailInp.placeholder = 'your@email.com';
    emailInp.style.cssText = `width:100%;padding:12px 14px;border:1.5px solid ${T.border};border-radius:12px;font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:10px;outline:none;`;
    wrap.appendChild(emailInp);

    const siBtn = document.createElement('button');
    siBtn.className = 'btn btn-primary';
    siBtn.textContent = S.lang==='ko' ? '이메일로 로그인 링크 받기 →' : 'Send sign-in link to my email →';
    siBtn.onclick = async () => {
      const email = emailInp.value.trim();
      if (!email) return;
      siBtn.textContent = S.lang==='ko' ? '전송 중...' : 'Sending...';
      siBtn.disabled = true;
      const { error } = await signInWithMagicLink(email);
      if (error) {
        siBtn.textContent = S.lang==='ko' ? '이메일로 로그인 링크 받기 →' : 'Send sign-in link to my email →';
        siBtn.disabled = false;
        sentMsg.textContent = S.lang==='ko' ? '✗ 오류가 발생했어요. 다시 시도해주세요.' : '✗ Something went wrong. Try again.';
        sentMsg.style.color = T.red;
      } else {
        sentMsg.textContent = S.lang==='ko' ? '✓ 이메일을 확인하고 링크를 탭하세요!' : '✓ Link sent! Check your email and tap the link to sign in.';
        sentMsg.style.color = T.green;
      }
      sentMsg.style.display = 'block';
    };
    wrap.appendChild(siBtn);

    const sentMsg = p(`font-size:12px;color:${T.gm};margin-top:8px;display:none;`, '');
    wrap.appendChild(sentMsg);

    // skip button
    const skipBtn = document.createElement('button');
    skipBtn.style.cssText = `background:none;border:none;width:100%;padding:14px;font-size:13px;color:${T.muted};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;`;
    skipBtn.textContent = S.lang==='ko' ? '나중에 할게요 →' : 'Skip for now →';
    skipBtn.onclick = () => go('home');
    wrap.appendChild(skipBtn);
  }

  return wrap;
}

function updateBtn() {
  const btn=document.getElementById('cont-btn'); if(!btn) return;
  let ok=false;
  if(S.step===1) ok=S.parent.trim().length>0;
  else if(S.step===2) ok=S.child.trim().length>0&&S.age.toString().length>0;
  else if(S.step===3.5) ok=(S.goals[S.editIdx]?.name||'').trim().length>0;
  btn.disabled=!ok;
  btn.style.background=ok?T.green:T.border;
  btn.style.color=ok?'#fff':T.muted;
  btn.style.cursor=ok?'pointer':'default';
}

// ── HOME ───────────────────────────────────────────────────────────
function renderHome() {
  const wrap = div('flex:1;overflow-y:auto;padding:16px 22px;');
  const date = S.lang==='ko'
    ? new Date().toLocaleDateString('ko-KR',{weekday:'long',month:'long',day:'numeric'})
    : new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const greet = div('margin-bottom:20px;');
  greet.innerHTML=`<p style="font-size:12px;color:${T.muted};margin-bottom:2px;">${date}</p><h2 style="font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:${T.text};">${S.lang==='ko'?`안녕하세요, ${S.parent} 👋`:`Hey ${S.parent} 👋`}</h2>`;
  wrap.appendChild(greet);

  // demo banner
  if(S.isDemo) {
    const banner = div(`background:${T.ol};border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;`);
    banner.innerHTML=`<p style="font-size:12px;color:${T.orange};font-weight:500;">${L('demoExiting')}</p>`;
    const exitBtn = document.createElement('button');
    exitBtn.textContent = L('exitDemo');
    exitBtn.style.cssText=`background:${T.orange};color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;white-space:nowrap;`;
    exitBtn.onclick = () => {
      S = { view:'onboard', step:0, parent:'', child:'', age:'', goals:[], editIdx:null, logGoalIdx:0, logs:[], tempLog:{}, isDemo:false };
      clearState();
      render();
    };
    banner.appendChild(exitBtn);
    wrap.appendChild(banner);
  }

  if(S.goals.length===0){
    const empty=div(`background:${T.gl};border-radius:20px;padding:24px;text-align:center;`);
    empty.innerHTML=`<p style="font-size:28px;margin-bottom:10px">🌿</p><p style="font-family:'Fraunces',serif;font-size:20px;color:${T.green};margin-bottom:8px">${L('noGoalsTitle')}</p><p style="font-size:13px;color:${T.gm};line-height:1.6">${L('noGoalsDesc',S.child)}</p>`;
    const gb=document.createElement('button'); gb.className='btn btn-primary'; gb.style.marginTop='14px'; gb.textContent=L('setUpGoals'); gb.onclick=()=>go('goals');
    empty.appendChild(gb); wrap.appendChild(empty);
  } else {
    const tl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;`,L('todayCards'));
    wrap.appendChild(tl);
    S.goals.forEach((g,i)=>{
      const st=stats(i); const c=CARD_COLORS[i%CARD_COLORS.length];
      const analysis = S.analyses && S.analyses[i];

      const card=div(`background:${c};border-radius:22px;padding:20px 22px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif;`);
      const logged=S.logs.filter(l=>l.goalIdx===i&&l.attempted==='Yes').length;
      card.innerHTML=`
        <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05)"></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;color:rgba(255,255,255,.92)">${g.icon} ${S.lang==='ko'?'목표':'Goal'} ${i+1}</span>
          <span style="font-size:12px;color:rgba(255,255,255,.5)">${logged>0?(S.lang==='ko'?`성공률 ${st.rate}%`:`${st.rate}% success`):L('tapToLog')}</span>
        </div>
        <p style="font-family:${S.lang==='ko'?'\'DM Sans\',sans-serif':'\'Fraunces\',serif'};font-size:19px;font-weight:400;color:#fff;line-height:1.3;margin-bottom:8px">${g.name}</p>
        <p style="font-size:12px;color:rgba(255,255,255,.65);margin-bottom:12px;font-family:'DM Sans',sans-serif;">📍 ${g.trigger}</p>
      `;

      // show analysis inside card if available, otherwise show actions
      if(analysis) {
        const updatedLabel = document.createElement('p');
        updatedLabel.style.cssText = `font-size:10px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;font-family:'DM Sans',sans-serif;`;
        updatedLabel.textContent = (S.lang==='ko' ? '업데이트 ' : 'Updated ') + (analysis.date||'');
        card.appendChild(updatedLabel);

        if(analysis.working?.length) {
          const wRow = div('display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;');
          wRow.innerHTML = `<span style="color:rgba(255,255,255,.7);font-size:12px;">✓</span><p style="font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;font-family:'DM Sans',sans-serif;">${analysis.working[0]}</p>`;
          card.appendChild(wRow);
        }

        if(analysis.next_actions?.length) {
          const na = div('display:flex;flex-direction:column;gap:5px;margin-top:4px;');
          analysis.next_actions.slice(0,2).forEach((a,ai) => {
            const row = div('display:flex;gap:8px;align-items:flex-start;');
            row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:1px">${ai+1}</div><p style="font-size:12px;color:rgba(255,255,255,.9);line-height:1.5;font-family:'DM Sans',sans-serif;">${a}</p>`;
            na.appendChild(row);
          });
          card.appendChild(na);
        }

        // avoid
        if(g.avoid) {
          const avoidBox = document.createElement('div');
          avoidBox.style.cssText = `margin-top:10px;background:rgba(0,0,0,.15);border-radius:8px;padding:6px 10px;font-size:11px;color:rgba(255,255,255,.8);font-family:'DM Sans',sans-serif;`;
          const avoidLabel = document.createElement('strong');
          avoidLabel.style.fontFamily = "'DM Sans',sans-serif";
          avoidLabel.textContent = (S.lang==='ko'?'피해야 할 것':'Avoid') + ': ';
          avoidBox.appendChild(avoidLabel);
          avoidBox.appendChild(document.createTextNode(g.avoid));
          card.appendChild(avoidBox);
        }

        // see full analysis link
        const weekBtn = document.createElement('button');
        weekBtn.style.cssText=`background:none;border:none;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;padding:0;text-decoration:underline;`;
        weekBtn.textContent = L('seeFullAnalysis');
        weekBtn.onclick=(e)=>{ e.stopPropagation(); go('week'); };
        card.appendChild(weekBtn);

      } else {
        // no analysis yet — show action steps
        const stepsDiv = div('display:flex;flex-direction:column;gap:5px;');
        stepsDiv.innerHTML = g.actions.slice(0,2).map((a,ai)=>`<div style="display:flex;gap:8px;align-items:flex-start"><div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:1px">${ai+1}</div><p style="font-size:12px;color:rgba(255,255,255,.9);line-height:1.5;font-family:'DM Sans',sans-serif;">${a}</p></div>`).join('');
        if(g.actions.length>2) {
          const more = document.createElement('p');
          more.style.cssText = 'font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;';
          more.textContent = `+${g.actions.length-2} more steps`;
          stepsDiv.appendChild(more);
        }
        card.appendChild(stepsDiv);

        if(g.avoid) {
          const avoidBox = document.createElement('div');
          avoidBox.style.cssText = `margin-top:10px;background:rgba(0,0,0,.15);border-radius:8px;padding:6px 10px;font-size:11px;color:rgba(255,255,255,.8);font-family:'DM Sans',sans-serif;`;
          const avoidLabel = document.createElement('strong');
          avoidLabel.style.fontFamily = "'DM Sans',sans-serif";
          avoidLabel.textContent = (S.lang==='ko'?'피해야 할 것':'Avoid') + ': ';
          avoidBox.appendChild(avoidLabel);
          avoidBox.appendChild(document.createTextNode(g.avoid));
          card.appendChild(avoidBox);
        }
      }

      card.onclick=()=>{S.logGoalIdx=i;S.tempLog={};go('log');};
      wrap.appendChild(card);
    });
  }

  return wrap;
}

// ── LOG ────────────────────────────────────────────────────────────
function renderLog() {
  const goal = S.goals[S.logGoalIdx];
  const wrap = div('flex:1;overflow-y:auto;padding:20px 22px 32px;');
  if(!goal){wrap.innerHTML=`<p style="color:${T.muted};font-size:14px;text-align:center;margin-top:40px">No goals yet.</p>`;return wrap;}

  const back=document.createElement('button'); back.style.cssText=`background:none;border:none;cursor:pointer;color:${T.tm};font-size:14px;margin-bottom:18px;padding:0;font-family:'DM Sans',sans-serif;`; back.textContent=L('back'); back.onclick=()=>go('home'); wrap.appendChild(back);

  if(S.goals.length>1){
    const tabs=div('display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;');
    S.goals.forEach((g,i)=>{const t=document.createElement('button');t.style.cssText=`padding:5px 12px;border-radius:20px;border:1px solid ${i===S.logGoalIdx?T.green:T.border};background:${i===S.logGoalIdx?T.gl:'#fff'};color:${i===S.logGoalIdx?T.green:T.muted};font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;`;t.textContent=`${g.icon} ${S.lang==='ko'?'목표':'Goal'} ${i+1}`;t.onclick=()=>{S.logGoalIdx=i;S.tempLog={};render();};tabs.appendChild(t);});
    wrap.appendChild(tabs);
  }

  wrap.appendChild(h('h2',"font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:#1A1A1A;margin-bottom:4px;",goal.name));
  wrap.appendChild(p(`font-size:13px;color:${T.muted};margin-bottom:12px;`,`📍 ${goal.trigger}`));

  // action steps card
  const actCard = div(`background:${T.gl};border-radius:16px;padding:14px 16px;margin-bottom:20px;`);
  const actLabel = p(`font-size:10px;font-weight:600;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;`,L('actionSteps'));
  actCard.appendChild(actLabel);
  const actList = div('display:flex;flex-direction:column;gap:6px;');
  (goal.actions||[]).filter(a=>a).forEach((a,ai)=>{
    const row = div('display:flex;gap:8px;align-items:flex-start;');
    const num = div(`width:20px;height:20px;min-width:20px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:1px;`);
    num.textContent = ai+1;
    const txt = p(`font-size:13px;color:${T.tm};line-height:1.55;`,a);
    row.appendChild(num); row.appendChild(txt);
    actList.appendChild(row);
  });
  actCard.appendChild(actList);
  if(goal.avoid){
    const avoidEl = div(`margin-top:10px;background:rgba(200,75,58,.08);border-radius:8px;padding:6px 10px;`);
    avoidEl.innerHTML = `<p style="font-size:12px;color:${T.red};line-height:1.5;font-family:'DM Sans',sans-serif;"><strong>${L('avoid')}:</strong> ${goal.avoid}</p>`;
    actCard.appendChild(avoidEl);
  }
  wrap.appendChild(actCard);

  // ABC sections
  const sectionTitle=(t)=>{const e=div(`font-size:11px;font-weight:600;color:${T.muted};letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid ${T.border};`);e.textContent=t;return e;};

  // BEFORE
  wrap.appendChild(sectionTitle(L('beforeState', S.child)));
  const stateChips=[L('calm'),L('focused'),L('resistant'),L('transition')];
  const sc=div('display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;');
  stateChips.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.before===opt;b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.before=opt;render();};sc.appendChild(b);});
  wrap.appendChild(sc);

  // TREATMENT
  wrap.appendChild(sectionTitle(L('treatment')));
  const attemptChips=[L('attemptedYes'),L('attemptedNo')];
  const atc=div('display:flex;gap:8px;margin-bottom:12px;');
  attemptChips.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.attempted===(opt===L('attemptedYes')?'Yes':'No');b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.attempted=(opt===L('attemptedYes')?'Yes':'No');render();};atc.appendChild(b);});
  wrap.appendChild(atc);

  if(S.tempLog.attempted==='Yes'){
    const tl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('techniqueUsed'));
    wrap.appendChild(tl);
    const ti=document.createElement('input'); ti.type='text'; ti.value=S.tempLog.technique||''; ti.placeholder='e.g. Melody + nickname, bedtime recap...'; ti.oninput=e=>S.tempLog.technique=e.target.value;
    wrap.appendChild(ti);
    const wl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('whatWorked'));
    wrap.appendChild(wl);
    const wta=document.createElement('textarea'); wta.value=S.tempLog.worked||''; wta.placeholder='e.g. Dooli-doo melody — Ian giggled and came downstairs'; wta.oninput=e=>S.tempLog.worked=e.target.value;
    wrap.appendChild(wta);
    const wdl=p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('whatDidntWork'));
    wrap.appendChild(wdl);
    const wdta=document.createElement('textarea'); wdta.value=S.tempLog.didnt_work||''; wdta.placeholder='e.g. Calling name 3 times — Ian ignored completely'; wdta.oninput=e=>S.tempLog.didnt_work=e.target.value;
    wrap.appendChild(wdta);
  }

  // AFTER
  wrap.appendChild(sectionTitle(L('afterResults')));
  const reactionOpts=[L('positive'),L('neutral'),L('negative')];
  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('reaction')));
  const rc=div('display:flex;gap:8px;margin-bottom:12px;');
  reactionOpts.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.reaction===opt;b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.reaction=opt;render();};rc.appendChild(b);});
  wrap.appendChild(rc);

  const outcomeOpts=[L('success'),L('partial'),L('noSuccess')];
  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('outcome')));
  const oc=div('display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;');
  outcomeOpts.forEach(opt=>{const b=document.createElement('button');const on=S.tempLog.outcome===opt;b.style.cssText=`padding:8px 14px;border-radius:20px;border:1.5px solid ${on?T.green:T.border};background:${on?T.gl:'#fff'};color:${on?T.green:T.tm};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;`;b.textContent=opt;b.onclick=()=>{S.tempLog.outcome=opt;render();};oc.appendChild(b);});
  wrap.appendChild(oc);

  wrap.appendChild(p(`font-size:11px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;`,L('changeNext')));
  const nta=document.createElement('textarea'); nta.value=S.tempLog.next||''; nta.placeholder='e.g. Try joining play first before calling'; nta.oninput=e=>S.tempLog.next=e.target.value; nta.style.marginBottom='20px;';
  wrap.appendChild(nta);

  const hasResult=S.tempLog.attempted||S.tempLog.reaction||S.tempLog.outcome;
  const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.disabled=!hasResult; saveBtn.textContent=L('saveEntry');
  if(!hasResult) saveBtn.style.cssText='background:'+T.border+';color:'+T.muted+';cursor:default;width:100%;padding:15px;border:none;border-radius:15px;font-size:15px;font-weight:500;font-family:DM Sans,sans-serif;';
  saveBtn.onclick=()=>{
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const d=new Date(); const date=`${d.getMonth()+1}/${d.getDate()}`;
    const newLog = {goalIdx:S.logGoalIdx,date,caregiver:'You',before:S.tempLog.before||'',attempted:S.tempLog.attempted||'',technique:S.tempLog.technique||'',worked:S.tempLog.worked||'',didnt_work:S.tempLog.didnt_work||'',reaction:S.tempLog.reaction||'',outcome:S.tempLog.outcome||'',next:S.tempLog.next||''};
    S.logs.push(newLog);
    S.tempLog={};
    saveState();
    // save to Supabase
    if (currentUser) {
      saveLogToSupabase({
        goalName: S.goals[S.logGoalIdx]?.name || '',
        date,
        caregiver: 'You',
        before: newLog.before,
        attempted: newLog.attempted,
        technique: newLog.technique,
        worked: newLog.worked,
        didnt_work: newLog.didnt_work,
        reaction: newLog.reaction,
        outcome: newLog.outcome,
        next: newLog.next,
      }, S.goals[S.logGoalIdx]?.goal_id || '');
    }
    // send to Google Sheet
    sendToSheet({
      user_id: USER_ID,
      session_id: SESSION_ID,
      goal_id: S.goals[S.logGoalIdx]?.goal_id || '',
      goal_version: S.goals[S.logGoalIdx]?.goal_version || 1,
      goal_number: S.goals[S.logGoalIdx]?.goal_number || (S.logGoalIdx + 1),
      parent: S.parent,
      child: S.child,
      childAge: S.age,
      goalName: S.goals[S.logGoalIdx]?.name || '',
      before: newLog.before,
      attempted: newLog.attempted,
      technique: newLog.technique,
      worked: newLog.worked,
      didnt_work: newLog.didnt_work,
      reaction: newLog.reaction,
      outcome: newLog.outcome,
      next: newLog.next,
    });
    const toast=div(`background:${T.gl};border-radius:13px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:12px;`);
    toast.innerHTML=`<span>✓</span><p style="font-size:13px;color:${T.green};font-weight:500">${L('loggedToast')}</p>`;
    wrap.appendChild(toast);
    setTimeout(()=>go('week'),1600);
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

// ── WEEK ───────────────────────────────────────────────────────────
function renderWeek() {
  const wrap=div('flex:1;overflow-y:auto;padding:24px 22px 32px;');
  const totalAtt=S.logs.filter(l=>l.attempted==='Yes').length;
  const totalSucc=S.logs.filter(l=>l.outcome==='Success').length;
  const overall=totalAtt?Math.round(totalSucc/totalAtt*100):0;

  const dateStr = S.lang === 'ko'
    ? new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric'})
    : new Date().toLocaleDateString('en-US', {month:'long', day:'numeric'});

  wrap.innerHTML=`<p style="font-size:12px;color:${T.muted};margin-bottom:4px">${dateStr}</p><h2 style="font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:${T.text};margin-bottom:6px">${L('weekTitle',S.child)}</h2><p style="font-size:14px;color:${T.tm};margin-bottom:20px;line-height:1.6">${L('weekSubtitle',totalAtt)}</p>`;

  if(totalAtt===0){
    const empty=div(`background:${T.gl};border-radius:18px;padding:24px;text-align:center;`);
    empty.innerHTML=`<p style="font-size:32px;margin-bottom:12px">📊</p><p style="font-family:'Fraunces',serif;font-size:18px;color:${T.green};margin-bottom:8px">${L('noLogsTitle')}</p><p style="font-size:13px;color:${T.gm};line-height:1.6">${L('noLogsDesc')}</p>`;
    const lb=document.createElement('button'); lb.className='btn btn-primary'; lb.style.marginTop='14px'; lb.textContent=L('startLogging'); lb.onclick=()=>go('home');
    empty.appendChild(lb); wrap.appendChild(empty); return wrap;
  }

  // summary
  const sr=div('display:flex;gap:10px;margin-bottom:20px;');
  [{v:`${totalAtt}`,l:L('attempts'),click:null},{v:`${overall}%`,l:L('overallSuccess'),click:null},{v:`${S.goals.length}`,l:L('goals'),click:()=>go('goals')}].forEach(s=>{const sc=div(`flex:1;background:${T.card};border-radius:14px;border:1px solid ${T.border};padding:12px;text-align:center;${s.click?'cursor:pointer;':''}`);sc.innerHTML=`<p style="font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:${T.text}">${s.v}</p><p style="font-size:11px;color:${s.click?T.green:T.muted};margin-top:3px">${s.l}${s.click?' →':''}</p>`;if(s.click)sc.onclick=s.click;sr.appendChild(sc);});
  wrap.appendChild(sr);

  // per-goal breakdown
  S.goals.forEach((g,i)=>{
    const st=stats(i); const sc=statusCfg(st.status);
    const gc=div(`background:${T.card};border-radius:18px;border:1px solid ${T.border};padding:16px 18px;margin-bottom:12px;`);
    const hdr=div('display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;');
    hdr.innerHTML=`<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:18px">${g.icon}</span><p style="font-size:14px;font-weight:500;color:${T.text}">${g.name}</p></div><p style="font-size:12px;color:${T.muted}">${L('attemptLabel',st.total)}</p></div><span style="font-size:11px;font-weight:500;background:${sc.bg};color:${sc.color};border-radius:20px;padding:4px 10px;white-space:nowrap">${sc.emoji} ${sc.label}</span>`;
    gc.appendChild(hdr);

    if(st.total>0){
      const bw=div('margin-bottom:10px;');
      const bb=div(`height:6px;border-radius:3px;background:${T.border};overflow:hidden;margin-bottom:5px;`);
      const bf=div(`height:100%;width:${st.rate}%;background:${sc.color};border-radius:3px;transition:width .8s ease;`);
      bb.appendChild(bf); bw.appendChild(bb);
      bw.innerHTML+=`<div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:${T.muted}">${S.lang==='ko'?'성공':'Success'} ${st.rate}% · ${S.lang==='ko'?'부분 성공':'Partial'} ${st.partialRate}%</span><span style="font-size:11px;font-weight:500;color:${sc.color}">${st.rate}%</span></div>`;
      gc.appendChild(bw);

      const adv=div(`background:${sc.bg};border-radius:10px;padding:10px 12px;margin-bottom:${st.worked.length||st.next.length?'10px':'0'};`);
      adv.innerHTML=`<p style="font-size:12px;color:${sc.color};line-height:1.55">${sc.tip}</p>`;
      gc.appendChild(adv);

      if(st.worked.length){
        const wn=div('margin-bottom:8px;');
        wn.appendChild(p(`font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;`,L('whatWorkedLabel')));
        st.worked.slice(0,2).forEach(note=>{const np=p(`font-size:12px;color:${T.tm};line-height:1.55;padding:5px 0;border-bottom:1px solid ${T.border};`,`✓ ${note}`);wn.appendChild(np);});
        gc.appendChild(wn);
      }
      if(st.next.length){
        const nn=div('');
        nn.appendChild(p(`font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;`,L('tryNext')));
        st.next.slice(0,1).forEach(note=>{const np=p(`font-size:12px;color:${T.tm};line-height:1.55;`,`→ ${note}`);nn.appendChild(np);});
        gc.appendChild(nn);
      }

      // Claude analysis section
      const analysisId = `analysis_${i}`;
      const analysisWrap = div('margin-top:12px;');
      analysisWrap.id = analysisId;

      // show existing analysis if available
      const existingAnalysis = S.analyses && S.analyses[i];
      if (existingAnalysis) {
        const a = existingAnalysis;
        const box = div(`background:${T.gl};border-radius:14px;padding:16px 18px;border:1px solid ${T.border};margin-bottom:10px;`);
        box.innerHTML = `<p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">${L('nextCycleLabel')}${a.date ? ' · ' + a.date : ''}</p>`;

        if(a.working?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('workingLabel')}</p>`;
          a.working.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✓ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        if(a.not_working?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('notWorkingLabel')}</p>`;
          a.not_working.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✗ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        if(a.next_actions?.length) {
          const s = div('margin-bottom:10px;');
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.green};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('tryNextCycle')}</p>`;
          a.next_actions.forEach((w,idx) => {
            const row = div('display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #e8f5ec;');
            row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:2px">${idx+1}</div><p style="font-size:12px;color:${T.tm};line-height:1.55">${w}</p>`;
            s.appendChild(row);
          });
          box.appendChild(s);
        }
        if(a.avoid?.length) {
          const s = div(`background:${T.rl};border-radius:10px;padding:10px 12px;`);
          s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.red};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('avoidLabel')}</p>`;
          a.avoid.forEach(w => {
            const np = p(`font-size:12px;color:${T.tm};line-height:1.55;font-family:'DM Sans',sans-serif;`, `✗ ${w}`);
            s.appendChild(np);
          });
          box.appendChild(s);
        }
        analysisWrap.appendChild(box);
      }

      const genBtn = document.createElement('button');
      genBtn.style.cssText = `width:100%;padding:11px;background:linear-gradient(135deg,${T.green},${T.gm});border:none;border-radius:12px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;`;
      genBtn.textContent = L('generateBtn');
      genBtn.onclick = async () => {
        genBtn.textContent = L('analyzing');
        genBtn.disabled = true;
        genBtn.style.opacity = '0.7';

        try {
          const goalLogs = S.logs.filter(l => l.goalIdx === i);
          const response = await fetch(ANALYZE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_id: USER_ID,
              child: S.child,
              childAge: S.age,
              goalName: g.name,
              lang: S.lang || 'en',
              logs: goalLogs
            })
          });

          const result = await response.json();

          if (result.status === 'ok' && result.analysis) {
            const a = result.analysis;

            // save analysis to state
            if (!S.analyses) S.analyses = [];
            S.analyses[i] = { ...a, date: new Date().toLocaleDateString(S.lang==='ko'?'ko-KR':'en-US') };

            // update goal actions with next_actions from Claude
            if (a.next_actions && a.next_actions.length > 0) {
              S.goals[i].actions = a.next_actions;
              S.goals[i].avoid = a.avoid ? a.avoid.join(' · ') : S.goals[i].avoid;
              S.goals[i].goal_version = (S.goals[i].goal_version || 1) + 1;
            }
            saveState();

            // show updated toast
            const updateToast = div(`background:${T.gl};border-radius:12px;padding:10px 14px;margin-bottom:10px;`);
            updateToast.innerHTML = `<p style="font-size:13px;color:${T.green};font-weight:500;">${L('cardUpdated')}</p>`;
            analysisWrap.appendChild(updateToast);

            const box = div(`background:${T.gl};border-radius:14px;padding:16px 18px;border:1px solid ${T.border};`);
            box.innerHTML = `<p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">${L('nextCycleLabel')}</p>`;

            if(a.working?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('workingLabel')}</p>`;
              a.working.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✓ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            if(a.not_working?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.muted};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('notWorkingLabel')}</p>`;
              a.not_working.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;padding:4px 0;border-bottom:1px solid ${T.border};`, `✗ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            if(a.next_actions?.length) {
              const s = div('margin-bottom:10px;');
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.green};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">${L('tryNextCycle')}</p>`;
              a.next_actions.forEach((w,idx) => {
                const row = div('display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #e8f5ec;');
                row.innerHTML = `<div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-top:2px">${idx+1}</div><p style="font-size:12px;color:${T.tm};line-height:1.55">${w}</p>`;
                s.appendChild(row);
              });
              box.appendChild(s);
            }

            if(a.avoid?.length) {
              const s = div(`background:${T.rl};border-radius:10px;padding:10px 12px;`);
              s.innerHTML = `<p style="font-size:10px;font-weight:500;color:${T.red};letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;">Avoid</p>`;
              a.avoid.forEach(w => {
                const np = p(`font-size:12px;color:${T.tm};line-height:1.55;font-family:'DM Sans',sans-serif;`, `✗ ${w}`);
                s.appendChild(np);
              });
              box.appendChild(s);
            }

            analysisWrap.appendChild(box);
          } else {
            genBtn.textContent = L('generateBtn');
            genBtn.disabled = false;
            genBtn.style.opacity = '1';
          }

        } catch(err) {
          // CORS issue fallback — show message
          analysisWrap.innerHTML = '';
          const fallback = div(`background:${T.gl};border-radius:12px;padding:14px 16px;`);
          fallback.innerHTML = `<p style="font-size:13px;color:${T.green};font-weight:500;margin-bottom:4px;">✓ Analysis requested!</p><p style="font-size:12px;color:${T.gm};line-height:1.6">Results are being saved to your sheet. Check the Beta_Recommendations tab in your Google Sheet to see the full analysis.</p>`;
          analysisWrap.appendChild(fallback);
        }
      };

      analysisWrap.appendChild(genBtn);
      gc.appendChild(analysisWrap);
    }

    const lb=document.createElement('button'); lb.style.cssText=`width:100%;padding:10px;background:none;border:1px solid ${T.border};border-radius:12px;font-size:13px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;`; lb.textContent=L('logToday',g.name); lb.onclick=()=>{S.logGoalIdx=i;S.tempLog={};go('log');};
    gc.appendChild(lb); wrap.appendChild(gc);
  });
  return wrap;
}

// ── GOALS ──────────────────────────────────────────────────────────
function renderGoals() {
  const wrap=div('flex:1;overflow-y:auto;padding:24px 22px 32px;');
  wrap.appendChild(h('h2',"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#1A1A1A;margin-bottom:6px;",L('goalsTitle')));
  wrap.appendChild(p(`font-size:14px;color:${T.muted};margin-bottom:24px;line-height:1.55;`, L('goalsSub', S.child)));

  S.goals.forEach((g,i)=>{
    const st=stats(i); const sc=statusCfg(st.status);
    const row=div(`background:${T.card};border-radius:18px;border:1px solid ${T.border};padding:16px 18px;margin-bottom:10px;`);
    const top=div('display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;');
    const left=div('display:flex;gap:10px;align-items:center;');
    left.innerHTML=`<span style="font-size:20px">${g.icon}</span><p style="font-size:14px;font-weight:500;color:${T.text}">${g.name||'Unnamed'}</p>`;
    const btns=div('display:flex;gap:6px;align-items:center;');
    if(st.total>0){const badge=document.createElement('span');badge.style.cssText=`font-size:10px;background:${sc.bg};color:${sc.color};border-radius:20px;padding:3px 8px;`;badge.textContent=`${st.rate}%`;btns.appendChild(badge);}
    const eb=document.createElement('button'); eb.textContent=L('editGoal'); eb.style.cssText=`background:none;border:1px solid ${T.border};border-radius:8px;padding:4px 10px;font-size:11px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;`; eb.onclick=()=>{S.editIdx=i;S.step=3.5;S.view='onboard';render();};
    const db=document.createElement('button'); db.textContent='✕'; db.style.cssText='background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;padding:0 4px;'; db.onclick=()=>{S.goals.splice(i,1);render();};
    btns.appendChild(eb); btns.appendChild(db); top.appendChild(left); top.appendChild(btns); row.appendChild(top);
    if(g.trigger) row.appendChild(p(`font-size:12px;color:${T.muted};`,`📍 ${g.trigger}`));
    wrap.appendChild(row);
  });

  if(S.goals.length<5){
    const ab=document.createElement('button'); ab.style.cssText=`width:100%;padding:14px;background:none;border:1.5px dashed ${T.border};border-radius:14px;font-size:14px;color:${T.muted};cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;`; ab.textContent=L('addGoal'); ab.onclick=()=>{S.goals.push({icon:'🎯',name:'',trigger:'',actions:[''],avoid:''});S.editIdx=S.goals.length-1;S.step=3.5;S.view='onboard';render();};
    wrap.appendChild(ab);
  }

  // restore code display
  const rcWrap = div(`background:${T.gl};border-radius:14px;padding:14px 18px;margin-top:16px;`);
  rcWrap.innerHTML = `
    <p style="font-size:11px;font-weight:500;color:${T.green};letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;">${L('restoreCode')}</p>
    <p style="font-family:'Fraunces',serif;font-size:28px;font-weight:400;color:${T.green};letter-spacing:.15em;margin-bottom:6px;">${RESTORE_CODE}</p>
    <p style="font-size:12px;color:${T.gm};line-height:1.6;">${L('restoreCodeDesc')}</p>
  `;
  wrap.appendChild(rcWrap);

  // reset
  const resetWrap = div('margin-top:16px;padding-top:16px;border-top:1px solid #EAE6DE;');
  const resetBtn = document.createElement('button');
  resetBtn.style.cssText=`width:100%;padding:12px;background:none;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;color:#94a3b8;cursor:pointer;font-family:'DM Sans',sans-serif;`;
  resetBtn.textContent=L('resetAll');
  resetBtn.onclick=()=>{
    if(confirm(L('resetConfirm'))){
      clearState();
      S={view:'onboard',step:0,lang:S.lang,parent:'',child:'',age:'',goals:[],editIdx:null,logGoalIdx:0,logs:[],analyses:[],isDemo:false,tempLog:{}};
      render();
    }
  };
  resetWrap.appendChild(resetBtn);

  // sign out / account section
  const accountWrap = div('margin-top:12px;');
  const user = currentUser;
  if (user) {
    const signOutBtn = document.createElement('button');
    signOutBtn.style.cssText=`width:100%;padding:12px;background:none;border:1px solid ${T.border};border-radius:12px;font-size:13px;color:${T.tm};cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:space-between;`;
    signOutBtn.innerHTML=`<span style="font-size:12px;color:${T.muted};">✓ ${currentUser.email}</span><span>Sign out</span>`;
    signOutBtn.onclick = async () => {
      if (supabase) await supabase.auth.signOut();
      currentUser = null;
      render();
    };
    accountWrap.appendChild(signOutBtn);
  } else {
    const siBox = div(`background:${T.card};border-radius:14px;border:1px solid ${T.border};padding:14px 16px;`);
    siBox.innerHTML=`<p style="font-size:13px;font-weight:500;color:${T.tm};margin-bottom:4px;">Create a free account</p><p style="font-size:12px;color:${T.muted};margin-bottom:10px;">Save your data and access it from any device.</p>`;

    const googleBtn = document.createElement('button');
    googleBtn.style.cssText=`width:100%;padding:10px;background:#fff;color:#1A1A1A;border:1.5px solid ${T.border};border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;`;
    googleBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A353" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>Sign in with Google`;
    googleBtn.onclick = signInWithGoogle;

    const orDiv = div('display:flex;align-items:center;gap:8px;margin-bottom:8px;');
    orDiv.innerHTML=`<div style="flex:1;height:1px;background:${T.border}"></div><p style="font-size:11px;color:${T.muted}">or</p><div style="flex:1;height:1px;background:${T.border}"></div>`;

    const emailInp = document.createElement('input');
    emailInp.type='email'; emailInp.placeholder='your@email.com';
    emailInp.style.cssText=`width:100%;padding:10px 12px;border:1.5px solid ${T.border};border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;margin-bottom:8px;outline:none;`;

    const siBtn = document.createElement('button');
    siBtn.style.cssText=`width:100%;padding:10px;background:${T.green};color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;`;
    siBtn.textContent='Send sign-in link to my email →';

    const siMsg = p(`font-size:12px;color:${T.gm};margin-top:6px;display:none;`,'');
    siBtn.onclick = async () => {
      const email = emailInp.value.trim();
      if (!email) return;
      siBtn.textContent = 'Sending...'; siBtn.disabled = true;
      const { error } = await signInWithMagicLink(email);
      if (error) {
        siBtn.textContent = 'Send sign-in link →'; siBtn.disabled = false;
        siMsg.textContent = '✗ Something went wrong.'; siMsg.style.color = T.red;
      } else {
        siMsg.textContent = '✓ Link sent! Check your email.'; siMsg.style.color = T.green;
      }
      siMsg.style.display = 'block';
    };

    siBox.appendChild(googleBtn);
    siBox.appendChild(orDiv);
    siBox.appendChild(emailInp);
    siBox.appendChild(siBtn);
    siBox.appendChild(siMsg);
    accountWrap.appendChild(siBox);
  }
  wrap.appendChild(accountWrap);

  wrap.appendChild(resetWrap);
  return wrap;
}

// ── RENDER ─────────────────────────────────────────────────────────
function render() {
  const screenEl=document.getElementById('screen');
  screenEl.innerHTML='';
  let content;
  if(S.view==='onboard') content=renderOnboard();
  else if(S.view==='home') content=renderHome();
  else if(S.view==='log') content=renderLog();
  else if(S.view==='week') content=renderWeek();
  else if(S.view==='goals') content=renderGoals();
  if(content) screenEl.appendChild(content);
  renderNav();
}

initSupabaseAndRender();
</script>
</body>
</html>
